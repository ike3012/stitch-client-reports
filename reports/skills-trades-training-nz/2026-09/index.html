:root{
  --peach:#ECC0AC; --brand-orange:#E9754B;

  --meta-badge-bg:#B3E1E8; --meta-badge-text:#1f4d57;
  --google-badge-bg:#D7CCF2; --google-badge-text:#3f3370;
  --good-bg:#D7F9E6; --good-text:#1F5C46; --warn-bg:#FEF9C8; --warn-text:#80501D; --critical-bg:#FBE3E3; --critical-text:#8C3232;

  --card-pink-bg:#ECE6F9; --card-yellow-bg:#ECECEC; --card-green-bg:#DCEFF2; --card-peach-bg:#ECECEC;

  --ink:#F0F0F0; --ink-secondary:#c4c4c4; --ink-muted:#9a9a9a; --hairline:#444444; --surface:#2D2D2D; --page:#1e1e1e; --cell-bg:#363636;
  --meta-badge-bg:#1f4d57; --meta-badge-text:#B3E1E8; --google-badge-bg:#3f3370; --google-badge-text:#D7CCF2;
  --good-bg:#15402d; --good-text:#8fe3b7; --warn-bg:#4a4316; --warn-text:#f0dc8a; --critical-bg:#4d2020; --critical-text:#f3a6a6;
  --card-blue-bg:#2F4447; --card-purple-bg:#3B3550; --card-pink-bg:#3B3550; --card-yellow-bg:#3A3A3A; --card-green-bg:#2F4447; --card-peach-bg:#3A3A3A;
  --card-blue-text:#B3E1E8; --card-purple-text:#D7CCF2; color-scheme:dark;--mast-bg:#161616;}}
:root[data-theme="dark"]{
  --ink:#F0F0F0; --ink-secondary:#c4c4c4; --ink-muted:#9a9a9a; --hairline:#444444; --surface:#2D2D2D; --page:#1e1e1e; --cell-bg:#363636;
  --meta-badge-bg:#1f4d57; --meta-badge-text:#B3E1E8; --google-badge-bg:#3f3370; --google-badge-text:#D7CCF2;

*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:24px}
.doc{max-width:900px;margin:0 auto;background:var(--surface);border-radius:16px;padding:40px 48px 56px}
.mast{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-bottom:24px;border-bottom:1px solid var(--hairline);margin-bottom:28px}
.logo{font-size:30px;font-weight:800;letter-spacing:-0.02em;color:var(--peach);line-height:1}
.mast .r{text-align:right}.mast .r b{display:block;font-size:16px}.mast .r span{color:var(--ink-muted);font-size:12px;display:block}
h2{font-size:18px;margin:0 0 4px;font-weight:700}
.sub{color:var(--ink-muted);font-size:12px;margin:0 0 14px}
.chead{display:flex;align-items:center;gap:10px;margin:40px 0 14px}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:999px}
.badge.meta{background:var(--meta-badge-bg);color:var(--meta-badge-text)}.badge.google{background:var(--google-badge-bg);color:var(--google-badge-text)}
.chead h2{margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--hairline);border-radius:12px;margin-bottom:22px;overflow:hidden}
.kpi{padding:14px 16px;border-left:1px solid var(--hairline);min-width:0}.kpi:first-child{border-left:0}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);font-weight:600}
.kpi .v{font-size:25px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .c{font-size:11.5px;color:var(--ink-muted);min-height:16px}
.kpi .d{font-size:11.5px;margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--ink-secondary)}
.tw{overflow-x:auto;margin-bottom:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);text-align:right;font-weight:600;padding:8px 8px;border-bottom:1px solid var(--hairline);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--hairline);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:190px}
td.strong{font-weight:700} tr.tot td{font-weight:700;border-top:1.5px solid var(--ink-muted)}
.nd{color:var(--ink-muted);font-style:italic;font-size:11.5px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill.good{background:var(--good-bg);color:var(--good-text)}.pill.warn{background:var(--warn-bg);color:var(--warn-text)}.pill.critical{background:var(--critical-bg);color:var(--critical-text)}
.plain{color:var(--ink-secondary);font-size:11.5px}
.note{font-size:12px;color:var(--ink-secondary);margin:6px 0 18px}
h3{font-size:14px;margin:26px 0 10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{border:1px solid var(--hairline);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0}
.card.top{border:1.5px solid var(--brand-orange)}
.art{position:relative;aspect-ratio:1/1;display:flex;align-items:flex-end;justify-content:flex-start;overflow:hidden}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:auto}
.art .fmt{position:relative;z-index:1;margin:8px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:rgba(255,255,255,.92);color:var(--card-blue-text)}
.art .rank{position:absolute;top:8px;right:8px;z-index:1;background:var(--brand-orange);color:#2D2D2D;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
.cb{padding:10px 10px 12px}.cb .n{font-weight:700;font-size:12.5px;line-height:1.3;overflow-wrap:anywhere}.cb .camp{font-size:10.5px;color:var(--ink-muted);margin-bottom:8px}
.m{display:grid;grid-template-columns:1fr 1fr;gap:6px}.m div{background:var(--cell-bg);border-radius:8px;padding:6px 8px}
.m span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);font-weight:600}.m b{font-size:13.5px}
.foot{font-size:10.5px;color:var(--ink-muted);margin-top:8px}
.bar{margin:8px 0}.bar .t{font-size:12px;margin-bottom:4px}.bar .tr{height:8px;border-radius:4px;background:var(--hairline);overflow:hidden}.bar .f{height:100%;background:var(--meta-badge-text)}
.footer{text-align:right;color:var(--ink-muted);font-size:11.5px;margin-top:48px;line-height:1.5}
@media (max-width:820px){.doc{padding:24px 18px 36px}.grid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--hairline)}}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr;gap:10px}}

/* Stitch brand: dark masthead band, peach wordmark */
.mast{background:var(--mast-bg);color:#F0F0F0;margin:-40px -48px 28px;padding:28px 48px;border-radius:inherit;border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:0;align-items:flex-end}
.mast .logo{color:#ECC0AC;font-size:32px;letter-spacing:-.03em;line-height:1}
.mast .r b{color:#F0F0F0}.mast .r span{color:#C0C0C0}
@media(max-width:820px){.mast{margin:-24px -18px 22px;padding:22px 18px}}

const PER="1 to 30 September 2026", PRIOR="1 to 31 August 2026";
const fmt=(n,d=0)=>n==null||isNaN(n)?"–":n.toLocaleString("en-NZ",{minimumFractionDigits:d,maximumFractionDigits:d});
const money=(n,d=2)=>n==null||!isFinite(n)?"–":"$"+fmt(n,d);
const pct=(n,d=2)=>n==null||!isFinite(n)?"–":fmt(n,d)+"%";
const pctDelta=(c,p)=>(p==null||p===0||c==null)?null:(c-p)/p*100;
function deltaLabel(c,p){const d=pctDelta(c,p);return d==null?"new":(d>=0?"+":"")+d.toFixed(1)+"%"}
function deltaPlain(c,p){return `<span class="plain">${deltaLabel(c,p)} vs Aug</span>`}
function deltaPill(c,p,inv=false){const d=pctDelta(c,p);if(d==null)return `<span class="pill warn">new</span>`;
  const better=inv?-d:d;const cls=better>5?"good":better<-5?"critical":"warn";return `<span class="pill ${cls}">${d>=0?"+":""}${d.toFixed(1)}%</span>`}
const sum=(a,f)=>a.reduce((x,r)=>x+f(r),0);
const div=(a,b)=>b?a/b:null;
function kpis(t){return `<div class="kpis">${t.map(k=>`<div class="kpi"><div class="l">${k.l}</div><div class="v">${k.v}</div><div class="c">${k.c||""}</div><div class="d">${k.d}</div></div>`).join("")}</div>`}

const ts={sp:ms.sp+gs.sp,ld:ms.ld+gs.ld},ta={sp:ma.sp+ga.sp,ld:ma.ld+ga.ld};
h+=`<h2>September at a glance</h2><p class="sub">All figures in NZD. Leads are lead form submits on each channel.</p>

${[["Meta Ads",ms,ma],["Google Ads",gs,ga],["Total",ts,ta]].map(([n,c,p],i)=>`<tr class="${i==2?"tot":""}"><td>${n}</td><td>${money(c.sp)}</td><td>${deltaPlain(c.sp,p.sp)}</td><td>${fmt(c.ld,i==1?1:0)}</td><td>${deltaPill(c.ld,p.ld)}</td><td>${money(div(c.sp,c.ld))}</td><td>${deltaPill(div(c.sp,c.ld),div(p.sp,p.ld),true)}</td></tr>`).join("")}
</tbody></table></div>`;

 {l:"Spend",v:money(ms.sp),c:"NZD",d:deltaPlain(ms.sp,ma.sp)},
