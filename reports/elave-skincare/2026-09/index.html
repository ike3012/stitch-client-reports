<style>
/* Layout: dark Stitch masthead over a light page; channel sections as open tables on #F0F0F0, dark KPI bands, white creative cards. */
:root{
  --dark:#2D2D2D; --light:#F0F0F0; --peach:#ECC0AC; --orange:#E9754B; --mint:#B3E1E8; --lilac:#D7CCF2; --grey:#C0C0C0;
  --ink:#2D2D2D; --ink2:#5b5b5b; --ink3:#8a8a8a; --hair:#d9d9d9; --card:#ffffff; --cell:#F0F0F0;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--light);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 48px}
.mast{background:var(--dark);color:var(--light);border-radius:0 0 18px 18px;padding:28px 28px 26px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:32px;letter-spacing:-.03em;color:var(--peach);line-height:1}
.mast .meta{text-align:right;min-width:0}
.mast .meta b{display:block;font-size:17px;font-weight:700}
.mast .meta span{font-size:12px;color:var(--grey)}
h2{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 10px}
section{margin-top:44px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 11px;border-radius:99px;background:var(--mint);color:var(--dark)}
.badge.g{background:var(--lilac)} .badge.t{background:var(--peach)} .badge.a{background:var(--grey)}
.head h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--dark);color:var(--light);border-radius:14px;overflow:hidden}
.kpi{padding:18px 18px 16px;border-left:1px solid #444;min-width:0}
.kpi:first-child{border-left:0}
.kpi .l{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .c{font-size:11.5px;color:var(--grey);min-height:17px}
.kpi .d{font-size:12px;margin-top:6px;font-weight:600}
.kpis.r2{margin-top:10px}
.up{color:var(--mint)} .down{color:var(--peach)} .flat{color:var(--grey)}
.plain{color:var(--grey);font-weight:500}
.tw{overflow-x:auto;margin-top:18px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:720px}
th{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);text-align:right;padding:8px 10px;border-bottom:1.5px solid var(--dark);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--hair);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:190px}
td:first-child{font-weight:600}
tr.tot td{font-weight:700;border-top:1.5px solid var(--dark);border-bottom:0}
.muted{color:var(--ink3);font-weight:400;font-size:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.pill.good{background:var(--mint)} .pill.warn{background:var(--lilac)} .pill.critical{background:var(--peach)}
.pl{color:var(--ink2);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
.card{background:var(--card);border-radius:12px;overflow:hidden;border:1.5px solid transparent;display:flex;flex-direction:column;min-width:0}
.card.top{border-color:var(--orange)}
.art{position:relative;aspect-ratio:1/1;background:var(--mint);overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.rank{position:absolute;top:8px;right:8px;background:var(--orange);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.fmt{position:absolute;left:8px;bottom:8px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--dark);color:var(--light);padding:2px 8px;border-radius:99px}
.body{padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
.nm{font-weight:700;font-size:12.5px;line-height:1.35;overflow-wrap:anywhere}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini div{background:var(--cell);border-radius:8px;padding:6px 8px;min-width:0}
.mini i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.mini b{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.foot{font-size:11px;color:var(--ink3);margin-top:auto}
.sum table{min-width:640px}
.note{font-size:12.5px;color:var(--ink2);margin:14px 0 0}
.foot2{margin-top:48px;text-align:right;color:var(--ink3);font-size:12px}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid #444}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:440px){.grid{grid-template-columns:1fr}.mast .meta{text-align:left}.kpi .v{font-size:22px}}
</style>
