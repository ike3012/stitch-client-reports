let h=`<div class="head"><span class="badge all">Summary</span><h2>September at a glance</h2></div><div class="summary"><ul>
<li>Total spend ${$(tc.spend)} NZD across Meta and Google (${dl(pd(tc.spend,tp.spend))} vs August), producing ${D1(tc.leads)} leads at ${$(tc.spend/tc.leads)} per lead (August: ${D1(tp.leads)} at ${$(tp.spend/tp.leads)}).</li>
<li>Meta delivered ${mc.leads} website leads at ${$(mc.spend/mc.leads)} each (${dl(pd(mc.leads,mp.leads))} leads, ${dl(pd(mc.spend/mc.leads,mp.spend/mp.leads))} cost per lead). ${best.n} was the most efficient ad set at ${$(best.cur.spend/best.cur.leads)} per lead.</li>
<li>Meta spend moved towards UltraFlex Pro (${$(ux.cur.spend)}, up from ${$(ux.prev.spend)}), which lifted its leads from ${ux.prev.leads} to ${ux.cur.leads} but at a higher cost per lead.</li>
<li>Google spend held flat at ${$(gc.spend)}, but lead form submits fell from ${D1(gp.lfs)} to ${D1(gc.lfs)}, so cost per submit rose to ${$(gc.spend/gc.lfs)}. All three Google campaigns are spending close to their full budget.</li>
</ul></div>
<h3>Spend, leads and cost per lead by channel</h3><div class="tw"><table><tr><th>Channel</th><th>Spend</th><th>Leads</th><th>Cost / lead</th><th>Spend (vs Aug)</th><th>Leads (vs Aug)</th><th>CPL (vs Aug)</th></tr>
<tr><td>Meta Ads<div class="muted">Website leads</div></td><td>${$(mc.spend)}</td><td class="n">${mc.leads}</td><td>${$(mc.spend/mc.leads)}</td><td>${dl(pd(mc.spend,mp.spend))}</td><td>${pill(mc.leads,mp.leads)}</td><td>${pill(mc.spend/mc.leads,mp.spend/mp.leads,true)}</td></tr>
<tr><td>Google Ads<div class="muted">Lead form submits</div></td><td>${$(gc.spend)}</td><td class="n">${D1(gc.lfs)}</td><td>${$(gc.spend/gc.lfs)}</td><td>${dl(pd(gc.spend,gp.spend))}</td><td>${pill(gc.lfs,gp.lfs)}</td><td>${pill(gc.spend/gc.lfs,gp.spend/gp.lfs,true)}</td></tr>
<tr class="tot"><td>Total</td><td>${$(tc.spend)}</td><td>${D1(tc.leads)}</td><td>${$(tc.spend/tc.leads)}</td><td>${dl(pd(tc.spend,tp.spend))}</td><td>${pill(tc.leads,tp.leads)}</td><td>${pill(tc.spend/tc.leads,tp.spend/tp.leads,true)}</td></tr></table></div>`;
document.getElementById("summary").innerHTML=h})();
// META
(function(){
const c=M.cur,p=M.prev,cc=c.spend/c.leads,cp=p.spend/p.leads;
let h=`<div class="head"><span class="badge meta">Meta Ads</span><h2>Facebook &amp; Instagram</h2></div>`;
h+=kpis([["Spend",$(c.spend),"NZD",plain(c.spend,p.spend)],["Impressions",N(c.impr),"Reach "+N(c.reach),plain(c.impr,p.impr)],["Leads",N(c.leads),"Website leads",pill(c.leads,p.leads)+" vs Aug"],["Cost per lead",$(cc),"CTR "+P(c.clicks/c.impr),pill(cc,cp,true)+" vs Aug"]]);
h+=`<h3>Ad sets (campaign: Cohe | Leadgen)</h3><div class="tw"><table><tr><th>Ad set</th><th>Spend</th><th>Impr.</th><th>Link clicks</th><th>Leads</th><th>Cost / lead</th><th>Spend (vs Aug)</th><th>Leads (vs Aug)</th><th>CPL (vs Aug)</th></tr>`;
MS.forEach(r=>{const a=r.cur,b=r.prev,x=a.spend/a.leads,y=b.spend/b.leads;
h+=`<tr><td>${r.n}</td><td>${$(a.spend)}</td><td>${N(a.impr)}</td><td>${N(a.link)}</td><td class="n">${a.leads}</td><td>${$(x)}</td><td>${dl(pd(a.spend,b.spend))}</td><td>${pill(a.leads,b.leads)}</td><td>${pill(x,y,true)}</td></tr>`});
const lc=sum(MS,"link","cur"),lp=sum(MS,"link","prev");
h+=`<tr class="tot"><td>Total</td><td>${$(c.spend)}</td><td>${N(c.impr)}</td><td>${N(lc)}</td><td>${c.leads}</td><td>${$(cc)}</td><td>${dl(pd(c.spend,p.spend))}</td><td>${pill(c.leads,p.leads)}</td><td>${pill(cc,cp,true)}</td></tr></table></div>`;
h+=`<p class="note">Landing page views: ${N(c.lpv)} in September vs ${N(p.lpv)} in August. Frequency held steady at about 2.8.</p>`;
h+=`<h3>Ad performance</h3>`;
const ads=[...MS].sort((a,b)=>b.cur.leads-a.cur.leads||b.cur.spend-a.cur.spend);
const bgs=["blue","purple","grey"];
h+=`<div class="grid">`+ads.map((s,i)=>{const a=s.cur;
return `<div class="card${i===0?" top":""}"><div class="art" style="background:var(--card-${bgs[i]}-bg)"><img src="${IMG[s.img]}" alt="${s.n} ad creative">${`<span class="rank">#${i+1}</span>`}<span class="fmt">Dynamic</span></div><div class="body"><b>${s.n}</b><div class="mc"><div><i>Spend</i><span>${$(a.spend)}</span></div><div><i>Leads</i><span>${a.leads}</span></div><div><i>CPL</i><span>${$(a.spend/a.leads)}</span></div><div><i>CTR (link)</i><span>${P(a.link/a.impr)}</span></div></div><div class="foot">${N(a.impr)} impr. · ${N(a.link)} link clicks</div></div></div>`}).join("")+`</div>`;
h+=`<p class="note">Each ad set runs one dynamic ad, ranked by leads. Meta only supplies a small preview frame for these dynamic ads.</p>`;
document.getElementById("meta").innerHTML=h})();
// GOOGLE
(function(){
const c=G.cur,p=G.prev,cc=c.spend/c.lfs,cp=p.spend/p.lfs;
let h=`<div class="head"><span class="badge google">Google Ads</span><h2>Search &amp; Performance Max</h2></div>`;
h+=kpis([["Spend",$(c.spend),"NZD",plain(c.spend,p.spend)],["Clicks",N(c.clicks),"CTR "+P(c.clicks/c.impr),plain(c.clicks,p.clicks)],["Lead form submits",D1(c.lfs),"",pill(c.lfs,p.lfs)+" vs Aug"],["Cost per lead form submit",$(cc),"",pill(cc,cp,true)+" vs Aug"]]);
h+=`<h3>Campaigns</h3><div class="tw"><table><tr><th>Campaign</th><th>Spend</th><th>Impr.</th><th>Clicks</th><th>CTR</th><th>Lead form submits</th><th>Cost / submit</th><th>Spend (vs Aug)</th><th>Submits (vs Aug)</th><th>Cost (vs Aug)</th></tr>`;
GC.forEach(r=>{const a=r.cur,b=r.prev,x=a.spend/a.lfs,y=b.spend/b.lfs;
h+=`<tr><td>${r.n}<div class="muted">${r.t}</div></td><td>${$(a.spend)}</td><td>${N(a.impr)}</td><td>${N(a.clicks)}</td><td>${P(a.clicks/a.impr)}</td><td class="n">${D1(a.lfs)}</td><td>${$(x)}</td><td>${dl(pd(a.spend,b.spend))}</td><td>${pill(a.lfs,b.lfs)}</td><td>${pill(x,y,true)}</td></tr>`});
h+=`<tr class="tot"><td>Total</td><td>${$(c.spend)}</td><td>${N(c.impr)}</td><td>${N(c.clicks)}</td><td>${P(c.clicks/c.impr)}</td><td>${D1(c.lfs)}</td><td>${$(cc)}</td><td>${dl(pd(c.spend,p.spend))}</td><td>${pill(c.lfs,p.lfs)}</td><td>${pill(cc,cp,true)}</td></tr></table></div>`;
h+=`<p class="note">The headline lead form submit figure counts the website form submission action only. Every conversion type is split out below.</p>`;
const tot=w=>CT.map((t,i)=>Object.values(GX).reduce((s,r)=>s+r[w][i],0));
const tc=tot("cur"),tp=tot("prev");
h+=`<h3>Conversions by type</h3><div class="tw"><table><tr><th>Conversion type</th><th>September</th><th>August</th><th>Change</th></tr>`+CT.map((t,i)=>`<tr><td>${t.l}<div class="muted">Cohe Group - GA4 (web) ${t.a}</div></td><td class="n">${D1(tc[i])}</td><td>${D1(tp[i])}</td><td>${pill(tc[i],tp[i])}</td></tr>`).join("")+`<tr class="tot"><td>All conversions</td><td>${D1(tc.reduce((a,b)=>a+b))}</td><td>${D1(tp.reduce((a,b)=>a+b))}</td><td>${dl(pd(tc.reduce((a,b)=>a+b),tp.reduce((a,b)=>a+b)))}</td></tr></table></div>`;
h+=`<h3>Conversions by type and campaign, September (August in brackets)</h3><div class="tw"><table><tr><th>Campaign</th>${CT.map(t=>`<th>${t.l}</th>`).join("")}<th>Total</th></tr>`+GC.map(r=>{const x=GX[r.n];return `<tr><td>${r.n}<div class="muted">${r.t}</div></td>${x.cur.map((v,i)=>`<td><b>${D1(v)}</b> <span class="muted">(${D1(x.prev[i])})</span></td>`).join("")}<td class="n">${D1(x.cur.reduce((a,b)=>a+b))} <span class="muted">(${D1(x.prev.reduce((a,b)=>a+b))})</span></td></tr>`}).join("")+`<tr class="tot"><td>Total</td>${tc.map((v,i)=>`<td>${D1(v)} <span class="muted">(${D1(tp[i])})</span></td>`).join("")}<td>${D1(tc.reduce((a,b)=>a+b))} <span class="muted">(${D1(tp.reduce((a,b)=>a+b))})</span></td></tr></table></div>`;
h+=`<p class="note">Phone and email clicks are taps on the phone number or email address on the website, not confirmed calls or emails. DuraFinish Pool System drove most of September's jump in these clicks (246.5, up from 13) while its website leads fell from 12 to 5. Purchases are GA4 web purchases. Decimals come from Google's data-driven attribution, which can split one conversion across campaigns.</p>`;
document.getElementById("google").innerHTML=h})();
</script></body></html>
