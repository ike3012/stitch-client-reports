<style>
/* Layout: dark masthead band, single 960px column on light grey ground, channel sections as open blocks with hairline rules (peach only on dark) */
:root{
  --dark:#2D2D2D; --light:#F0F0F0; --peach:#ECC0AC; --orange:#E9754B; --mint:#B3E1E8; --lilac:#D7CCF2; --grey:#C0C0C0;
  --bg:#F0F0F0; --fg:#2D2D2D; --fg2:#5d5d5d; --muted:#727272; --line:#d9d9d9; --cell:#E6E6E6; --band:#2D2D2D; --band-fg:#F0F0F0; --band-muted:#C0C0C0;
  --tile:#E9E9E9;
  --good-bg:#cfeee0; --good-fg:#1c5a43; --warn-bg:#f7efc2; --warn-fg:#6f4a1a; --crit-bg:#f6d9d6; --crit-fg:#8a2f2c;
  --li-bg:#B3E1E8; --li-fg:#1f4d57; --goog-bg:#D7CCF2; --goog-fg:#3f3370;
  --art1:#B3E1E8; --art2:#D7CCF2; --art3:#C0C0C0;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#232323; --fg:#F0F0F0; --fg2:#c4c4c4; --muted:#9a9a9a; --line:#3d3d3d; --cell:#303030; --tile:#2b2b2b;
  --good-bg:#1f3d31; --good-fg:#b8ecd2; --warn-bg:#443d1c; --warn-fg:#f1e3a0; --crit-bg:#4a2524; --crit-fg:#f5c2be;
  --li-bg:#1f4d57; --li-fg:#B3E1E8; --goog-bg:#3f3370; --goog-fg:#D7CCF2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#232323; --fg:#F0F0F0; --fg2:#c4c4c4; --muted:#9a9a9a; --line:#3d3d3d; --cell:#303030; --tile:#2b2b2b;
  --good-bg:#1f3d31; --good-fg:#b8ecd2; --warn-bg:#443d1c; --warn-fg:#f1e3a0; --crit-bg:#4a2524; --crit-fg:#f5c2be;
  --li-bg:#1f4d57; --li-fg:#B3E1E8; --goog-bg:#3f3370; --goog-fg:#D7CCF2; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;margin:0}
.band{background:var(--band);color:var(--band-fg)}
.wrap{max-width:960px;margin:0 auto;padding-inline:20px}
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:26px}
.logo{font-size:32px;font-weight:800;letter-spacing:-.03em;color:var(--peach);line-height:1}
.mast .r{text-align:right}.mast .r b{display:block;font-size:17px;font-weight:700}.mast .r span{font-size:12px;color:var(--band-muted)}
main{padding-block:28px 40px;display:flex;flex-direction:column;gap:44px}
h3{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:99px}
.badge.li{background:var(--li-bg);color:var(--li-fg)}.badge.goog{background:var(--goog-bg);color:var(--goog-fg)}.badge.comb{background:var(--dark);color:var(--peach)}
.sub{color:var(--fg2);font-size:13px;margin:0 0 14px;max-width:75ch}
.note{font-size:12.5px;color:var(--fg2);margin:10px 0 0;max-width:80ch}
.bul{margin:0;padding:16px 18px 16px 34px;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:7px;max-width:none}
.bul li{padding-left:2px}.bul li::marker{color:var(--orange)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{padding:14px 16px;border-left:1px solid var(--line);min-width:0}.kpi:first-child{border-left:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .c{font-size:12px;color:var(--muted);min-height:18px}
.kpi .d{margin-top:6px;font-size:12px;min-height:22px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:18px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:190px}
tr:last-child td{border-bottom:0}tr.tot td{font-weight:700;background:var(--tile)}
td.muted{color:var(--muted)}
.cap{margin:26px 0 0;font-size:14px;font-weight:700}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good-fg)}.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}.pill.critical{background:var(--crit-bg);color:var(--crit-fg)}
.plain{color:var(--muted);font-size:12px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum .col{padding:14px 16px;border-left:1px solid var(--line);min-width:0}.sum .col:first-child{border-left:0}
.sum .nm{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.sum .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:5px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.sum .nm + .row{border-top:0}.sum .row .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.sum .row .n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.sum .row .dd{flex-basis:100%;text-align:right;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
.card{background:var(--tile);border-radius:12px;overflow:hidden;border:1.5px solid transparent;min-width:0;display:flex;flex-direction:column}
.card.top{border-color:var(--orange)}
.art{position:relative;aspect-ratio:1/1;max-width:100%;display:flex;align-items:flex-end;padding:8px}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art .fmt{position:relative;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:rgba(240,240,240,.92);color:#3f3370;padding:2px 8px;border-radius:99px}
.rank{position:absolute;top:8px;right:8px;background:var(--orange);color:#2D2D2D;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.cb .n{font-weight:700;font-size:12.5px;line-height:1.3;overflow-wrap:anywhere}
.cb .s{font-size:11.5px;color:var(--muted);line-height:1.3;min-height:2.6em}
.m{display:grid;grid-template-columns:1fr 1fr;gap:6px}.m div{background:var(--cell);border-radius:8px;padding:6px 8px}
.m i{display:block;font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}.m b{font-size:13.5px;font-variant-numeric:tabular-nums}
.foot{font-size:11.5px;color:var(--muted)}
footer{padding-block:22px;text-align:right;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}
@media(max-width:640px){.sum{grid-template-columns:1fr}.sum .col{border-left:0;border-top:1px solid var(--line)}.sum .col:first-child{border-top:0}.mast .r{text-align:left}}
@media(max-width:420px){.grid{gap:10px}.kpi .v{font-size:22px}}
</style>

const nzd=(v,d=2)=>v==null||!isFinite(v)?'–':'$'+v.toLocaleString('en-NZ',{minimumFractionDigits:d,maximumFractionDigits:d});

function pd(c,p){if(p==null||p===0||c==null)return null;return (c-p)/p*100}
