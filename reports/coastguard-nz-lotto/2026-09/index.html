<style>
/* Layout: dark Stitch masthead band, light grey ground, white data panels, one column 960px */
:root{--dark:#2D2D2D;--light:#F0F0F0;--peach:#ECC0AC;--orange:#E9754B;--mint:#B3E1E8;--lilac:#D7CCF2;--grey:#C0C0C0;
--page:#F0F0F0;--panel:#FFFFFF;--ink:#2D2D2D;--ink2:#5b5b5b;--line:#e2e2e2;--cell:#F0F0F0;--band:#2D2D2D;--bandink:#F0F0F0;--good-bg:#B3E1E8;--good-tx:#1f4a52;--warn-bg:#F0F0F0;--warn-tx:#5b5b5b;--crit-bg:#E9754B;--crit-tx:#fff;
--font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#232323;--panel:#2D2D2D;--ink:#F0F0F0;--ink2:#b5b5b5;--line:#444;--cell:#383838;--band:#1b1b1b;--good-bg:#2c5a63;--good-tx:#d8f3f7;--warn-bg:#3b3b3b;--warn-tx:#c0c0c0;color-scheme:dark}}
:root[data-theme="dark"]{--page:#232323;--panel:#2D2D2D;--ink:#F0F0F0;--ink2:#b5b5b5;--line:#444;--cell:#383838;--band:#1b1b1b;--good-bg:#2c5a63;--good-tx:#d8f3f7;--warn-bg:#3b3b3b;--warn-tx:#c0c0c0;color-scheme:dark}
body{background:var(--page);color:var(--ink);font-family:var(--font);margin:0;font-size:14px;line-height:1.5}
.band{background:var(--band);color:var(--bandink);padding:28px 16px}
.wrap{max-width:960px;margin:0 auto}
.band .wrap{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:32px;letter-spacing:-.03em;color:var(--peach);line-height:1}
.ttl{text-align:right}.ttl b{display:block;font-size:18px;font-weight:700}.ttl span{color:var(--grey);font-size:12.5px}
main{padding:24px 16px 16px}
section{margin-bottom:36px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--mint);color:#1f4a52}
.badge.g{background:var(--lilac);color:#3f3566}
h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.read{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:28px}
.read h3{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.read ul{margin:0;padding-left:18px}.read li{margin:4px 0;max-width:75ch}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--band);color:var(--bandink);border-radius:12px;overflow:hidden}
.kpi{padding:16px 18px;border-right:1px solid #ffffff22;min-width:0}.kpi:last-child{border:0}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);font-weight:600}
.kpi .v{font-size:26px;font-weight:700;color:var(--peach);margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .c{font-size:12px;color:var(--grey);min-height:18px}
.kpi .d{font-size:12px;margin-top:6px;color:var(--bandink)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-weight:600;font-size:12px;font-variant-numeric:tabular-nums}
.pill.good{background:var(--good-bg);color:var(--good-tx)}.pill.warn{background:var(--warn-bg);color:var(--warn-tx)}.pill.critical{background:var(--crit-bg);color:var(--crit-tx)}
.dp{color:var(--grey);font-variant-numeric:tabular-nums}
td .dp{color:var(--ink2)}
h3.sub{font-size:14px;font-weight:700;margin:22px 0 8px}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:780px;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
tr:last-child td{border:0}
td.n{font-weight:700}.mut{color:var(--ink2);font-size:12px;display:block;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.top{border:1.5px solid var(--orange)}
.art{position:relative;aspect-ratio:1/1;background:var(--lilac)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.rank{position:absolute;top:8px;right:8px;background:var(--orange);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.fmt{position:absolute;left:8px;bottom:8px;background:#2D2D2D;color:#ECC0AC;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
.cb{padding:12px;display:flex;flex-direction:column;gap:8px}
.cb b{font-size:13px;line-height:1.3}.cb .hd{font-size:12px;color:var(--ink2);margin-top:-6px}
.m{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.m div{background:var(--cell);border-radius:8px;padding:6px 8px}.m small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}.m span{font-weight:700;font-variant-numeric:tabular-nums}
.foot{font-size:11.5px;color:var(--ink2)}
.note{font-size:12.5px;color:var(--ink2);margin:10px 2px 0;max-width:80ch}
footer{text-align:right;color:var(--ink2);font-size:12px;padding:0 16px 40px}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid #ffffff22}.ttl{text-align:left}}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
