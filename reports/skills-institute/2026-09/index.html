<title>Skills Institute September 2026</title>

<style>
/* Layout: single white doc panel on a light page, masthead + channel sections per the Stitch brand kit */
/* Stitch brand: dark #2D2D2D, light #F0F0F0, peach #ECC0AC (dark grounds only), orange #E9754B (small doses), mint #B3E1E8, lilac #D7CCF2, grey #C0C0C0 */
:root{
  --st-dark:#2D2D2D;--st-light:#F0F0F0;--st-peach:#ECC0AC;--st-orange:#E9754B;--st-mint:#B3E1E8;--st-lilac:#D7CCF2;--st-grey:#C0C0C0;
  --brand-orange:var(--st-orange);
  --mast-bg:var(--st-dark);--mast-ink:var(--st-light);--mast-muted:#b9b9b9;--mast-logo:var(--st-peach);
  --ink:#2D2D2D;--ink-secondary:#555555;--ink-muted:#767676;--hairline:#e2e2e2;
  --surface:#ffffff;--page:#F0F0F0;--cell-bg:#f7f7f7;
  --meta-badge-bg:var(--st-mint);--meta-badge-text:#2D2D2D;
  --google-badge-bg:var(--st-lilac);--google-badge-text:#2D2D2D;
  --linkedin-badge-bg:var(--st-grey);--linkedin-badge-text:#2D2D2D;
  --good-bg:#D7F2E4;--good-text:#1F5C46;--warn-bg:#F7EFCF;--warn-text:#76501D;--critical-bg:#FBE1D8;--critical-text:#8C3A22;
  --card-blue-bg:var(--st-mint);--card-blue-text:#2D2D2D;--card-purple-bg:var(--st-lilac);--card-purple-text:#2D2D2D;
  --card-pink-bg:var(--st-grey);--card-pink-text:#2D2D2D;--card-yellow-bg:var(--st-mint);--card-yellow-text:#2D2D2D;
  --card-green-bg:var(--st-lilac);--card-green-text:#2D2D2D;--card-peach-bg:var(--st-grey);--card-peach-text:#2D2D2D;
  --bar-track:#F0F0F0;
  --font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --mast-bg:#1b1b1b;--ink:#F0F0F0;--ink-secondary:#c9c9c9;--ink-muted:#a0a0a0;--hairline:#444444;--surface:#2D2D2D;--page:#232323;--cell-bg:#363636;
  --good-bg:#1d4434;--good-text:#a6e6c6;--warn-bg:#4a4116;--warn-text:#efd28f;--critical-bg:#4f2a1f;--critical-text:#f4b9a3;
  --bar-track:#3a3a3a;color-scheme:dark}}
:root[data-theme="dark"]{
  --mast-bg:#1b1b1b;--ink:#F0F0F0;--ink-secondary:#c9c9c9;--ink-muted:#a0a0a0;--hairline:#444444;--surface:#2D2D2D;--page:#232323;--cell-bg:#363636;
  --good-bg:#1d4434;--good-text:#a6e6c6;--warn-bg:#4a4116;--warn-text:#efd28f;--critical-bg:#4f2a1f;--critical-text:#f4b9a3;
  --bar-track:#3a3a3a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:24px}
.doc{max-width:900px;margin:0 auto;background:var(--surface);padding:40px 48px 56px;border-radius:4px}
.mast{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:-40px -48px 28px;padding:28px 48px;background:var(--mast-bg);color:var(--mast-ink);border-radius:4px 4px 0 0}
.logo{font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--mast-logo);line-height:1}
.mast .r{text-align:right}.mast .r b{display:block;font-size:15px;color:var(--mast-ink)}.mast .r span{display:block;color:var(--mast-muted);font-size:12px}
h2{font-size:18px;margin:0}
.sum{border:1px solid var(--hairline);border-radius:12px;padding:16px 20px;margin-bottom:32px;background:var(--cell-bg)}
.sum h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted)}
.sum ul{margin:0;padding-left:18px;display:grid;gap:5px}
section{margin-top:40px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:999px}
.badge.meta{background:var(--meta-badge-bg);color:var(--meta-badge-text)}.badge.google{background:var(--google-badge-bg);color:var(--google-badge-text)}.badge.linkedin{background:var(--linkedin-badge-bg);color:var(--linkedin-badge-text)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--hairline);border-radius:12px;overflow:hidden}
.kpi{padding:14px 16px;border-left:1px solid var(--hairline);min-width:0}.kpi:first-child{border-left:0}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);font-weight:600}
.kpi .v{font-size:25px;font-weight:700;margin-top:4px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .c{font-size:11.5px;color:var(--ink-muted);min-height:16px}
.kpi .d{margin-top:6px;font-size:11.5px;min-height:20px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctx{margin:10px 2px 0;font-size:12px;color:var(--ink-secondary)}
h3.sub{font-size:13px;margin:26px 0 8px}
.tw{overflow-x:auto;border:1px solid var(--hairline);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);text-align:right;padding:9px 10px;border-bottom:1px solid var(--hairline);white-space:nowrap;background:var(--cell-bg)}
td{padding:8px 10px;border-bottom:1px solid var(--hairline);text-align:right;vertical-align:top;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:190px;position:sticky;left:0;background:var(--surface)}
th:first-child{background:var(--cell-bg)}
tr:last-child td{border-bottom:0}
td b{font-weight:700}
td .sm{display:block;font-size:10.5px;color:var(--ink-muted);margin-top:2px}
.nd{color:var(--ink-muted);font-style:italic}
tr.tot td{font-weight:700;background:var(--cell-bg)}
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;margin-top:2px}
.pill.good{background:var(--good-bg);color:var(--good-text)}.pill.warn{background:var(--warn-bg);color:var(--warn-text)}.pill.critical{background:var(--critical-bg);color:var(--critical-text)}
.plain{color:var(--ink-muted);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{border:1px solid var(--hairline);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0}
.card.top{border:1.5px solid var(--brand-orange)}
.art{position:relative;aspect-ratio:1/1;display:flex;align-items:flex-end;padding:8px}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art .rank{position:absolute;top:8px;right:8px;background:var(--brand-orange);color:#2D2D2D;font-weight:800;font-size:11px;padding:2px 8px;border-radius:999px;z-index:2}
.art .tag{position:relative;z-index:2;font-size:10px;font-weight:700;background:var(--surface);color:var(--ink-secondary);padding:2px 7px;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb{padding:10px}
.cb .n{font-weight:700;font-size:12px;overflow-wrap:anywhere;min-height:32px}
.mm{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.mm div{background:var(--cell-bg);border-radius:8px;padding:6px 8px}
.mm small{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted)}
.mm b{font-size:13px}
.foot{margin-top:8px;font-size:10.5px;color:var(--ink-muted)}
.note{font-size:12px;color:var(--ink-secondary);margin:10px 2px 0}
.blocks{display:grid;gap:26px}
.blk h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:0 0 4px;font-size:15px}
.blk h3 span{font-size:12px;font-weight:400;color:var(--ink-muted)}
.pfoot{margin-top:48px;text-align:right;color:var(--ink-muted);font-size:11.5px;line-height:1.5}
@media(max-width:720px){.doc{padding:24px 18px 36px}.mast{margin:-24px -18px 24px;padding:22px 18px}.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--hairline)}.grid{grid-template-columns:1fr 1fr}.mast .r{text-align:left}}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style>

const $=s=>document.querySelector(s);
const nf=(n,d=0)=>n==null?'–':Number(n).toLocaleString('en-NZ',{minimumFractionDigits:d,maximumFractionDigits:d});
const cur=(n,d=0)=>n==null?'–':'$'+nf(n,d);
const pct=(n,d=2)=>n==null?'–':nf(n,d)+'%';
const div=(a,b)=>(b>0&&a!=null)?a/b:null;
const pctDelta=(c,p)=>(c==null||p==null||p===0)?null:(c-p)/p*100;
function deltaPlain(c,p,pp){ // plain-text delta for context metrics
  if(pp) {const d=c-p;return `<span class="plain">${d>=0?'+':''}${nf(d,2)} pts vs ${R.prevLabel}</span>`}
  const d=pctDelta(c,p);return d==null?'':`<span class="plain">${d>=0?'+':''}${nf(d,1)}% vs ${R.prevLabel}</span>`}
function deltaPill(c,p,invert,pp){ // coloured delta for performance metrics
  let d=pp?((c==null||p==null)?null:(c-p)/p*100):pctDelta(c,p); if(d==null)return '';
  const good=invert?-d:d; const cls=good>5?'good':good<-5?'critical':'warn';
  return `<span class="pill ${cls}">${d>=0?'+':''}${nf(d,1)}%</span>`}
function kpi(l,v,c,d){return `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="c">${c||''}</div><div class="d">${d||''}</div></div>`}
function rowTot(o){const t={spend:0,impr:0,clicks:0,leads:0};o.forEach(x=>{t.spend+=x.spend||0;t.impr+=x.impr||0;t.clicks+=x.clicks||0;t.leads+=x.leads||0});return t}
function head(cls,label,title){return `<div class="head"><span class="badge ${cls}">${label}</span><h2>${title}</h2></div>`}
function camp(rows,leadLabel,opts){
  // rows: {name,cur,prev}
  const hasPrev=!opts.noPrev;
  let h=`<div class="tw"><table><thead><tr><th>Campaign</th><th>Spend</th><th>Impr.</th><th>Clicks</th><th>CTR</th><th>${leadLabel}</th><th>${opts.cpl}</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    const c=r.cur,p=r.prev;
    if(!c||!(c.spend>0||c.impr>0)){h+=`<tr><td>${r.name}</td><td colspan="6" class="nd" style="text-align:left">No delivery in ${R.curLabel}${p?` (${cur(p.spend)} spend in ${R.prevLabel})`:''}</td></tr>`;return}
    const ctr=div(c.clicks,c.impr)*100,pctr=p?div(p.clicks,p.impr)*100:null;
    const cpl=div(c.spend,c.leads),pcpl=p?div(p.spend,p.leads):null;
    const dc=(hasPrev&&p)?1:0;
    h+=`<tr><td>${r.name}${(hasPrev&&!p)?'<span class="sm">New in '+R.curLabel+'</span>':''}</td>
    <td>${cur(c.spend)}${dc?`<span class="sm">${(()=>{const d=pctDelta(c.spend,p.spend);return d==null?'':(d>=0?'+':'')+nf(d,1)+'%'})()}</span>`:''}</td>
    <td>${nf(c.impr)}</td><td>${nf(c.clicks)}</td>
    <td>${pct(ctr)}${dc?`<br>${deltaPill(ctr,pctr,false,true)}`:''}</td>
    <td><b>${c.leads==null?'–':nf(c.leads,opts.dec||0)}</b>${dc&&p.leads!=null?`<br>${deltaPill(c.leads,p.leads,false,true)}`:''}</td>
    <td>${c.leads?cur(cpl,2):'–'}${dc&&cpl!=null&&pcpl!=null?`<br>${deltaPill(cpl,pcpl,true,true)}`:''}</td></tr>`});
  return h+`</tbody></table></div>`}
function cards(ads,metricLabel,cplLabel,topN){
  const pal=['blue','purple','pink','blue','purple','yellow','green','peach'];
  return `<div class="grid">`+ads.map((a,i)=>{
    const p=pal[i%8],top=i<topN;
    return `<div class="card${top?' top':''}"><div class="art" style="background:var(--card-${p}-bg)"><img src="${a.img}" alt="${a.name}">${top?`<span class="rank">#${i+1}</span>`:''}<span class="tag">${a.camp}</span></div>
    <div class="cb"><div class="n">${a.name}</div><div class="mm"><div><small>Spend</small><b>${cur(a.spend)}</b></div><div><small>${metricLabel}</small><b>${nf(a.leads)}</b></div><div><small>${cplLabel}</small><b>${a.leads?cur(a.spend/a.leads,2):'–'}</b></div><div><small>CTR</small><b>${pct(a.clicks/a.impr*100)}</b></div></div>
    <div class="foot">${nf(a.impr)} impressions · ${nf(a.clicks)} clicks</div></div></div>`}).join('')+`</div>`}

const a=R.meta.acc,c=a.cur,p=a.prev,g=R.google,gc=g.cur,gp=g.prev,L=R.li;
const ctr=(x)=>x.clicks/x.impr*100;
let h=`<div class="mast"><div class="logo">stitch</div><div class="r"><b>${R.name}</b><span>Monthly performance report</span><span>${R.range}</span><span>All figures NZD</span></div></div>`;
h+=`<div class="sum"><h3>September at a glance</h3><ul>${R.bullets.map(b=>`<li>${b}</li>`).join('')}</ul></div>`;
h+=`<section>${head('meta','Meta Ads','Facebook & Instagram')}<div class="kpis">`+
 kpi('Spend',cur(c.spend),'NZD',deltaPlain(c.spend,p.spend))+
 kpi('Leads',nf(c.leads),'Lead_B2C_Domestic',deltaPill(c.leads,p.leads,false))+
 kpi('Cost per lead',cur(c.spend/c.leads,2),'Avg, all Meta spend',deltaPill(c.spend/c.leads,p.spend/p.leads,true))+
 kpi('CTR',pct(ctr(c)),'All clicks',deltaPill(ctr(c),ctr(p),false))+`</div>
 <div class="ctx">Impressions ${nf(c.impr)} ${deltaPlain(c.impr,p.impr)} &nbsp;·&nbsp; Reach ${nf(c.reach)} ${deltaPlain(c.reach,p.reach)} &nbsp;·&nbsp; Clicks ${nf(c.clicks)} ${deltaPlain(c.clicks,p.clicks)}</div>
 <h3 class="sub">Performance by campaign</h3>${camp(R.meta.rows,'Leads',{cpl:'Cost / lead'})}
 <p class="note">Leads are the Lead_B2C_Domestic pixel event. Small pills compare with August; cost per lead is green when it falls. In August, "WEL | ILN | June" and "Real Estate CPD Launch Campaign" also ran and are not in September's delivery; they did not report Lead_B2C_Domestic leads.</p>
 <h3 class="sub">Top ads by leads, September</h3>${cards(R.meta.ads,'Leads','Cost / lead',3)}
 <p class="note">Ranked by leads among ads with delivery in September. The Auckland Healthcare L3 F2F and Healthcare L4 F2F ads show the same thumbnail.</p></section>`;
h+=`<section>${head('google','Google Ads','Search, Performance Max & Demand Gen')}<div class="kpis">`+
 kpi('Spend',cur(gc.spend),'NZD',deltaPlain(gc.spend,gp.spend))+
 kpi('Lead form submits',nf(gc.leads,1),'SUBMIT_LEAD_FORM actions',deltaPill(gc.leads,gp.leads,false))+
 kpi('Cost per submit',cur(gc.spend/gc.leads,2),'Avg',deltaPill(gc.spend/gc.leads,gp.spend/gp.leads,true))+
 kpi('CTR',pct(ctr(gc)),'',deltaPill(ctr(gc),ctr(gp),false))+`</div>
 <div class="ctx">Impressions ${nf(gc.impr)} ${deltaPlain(gc.impr,gp.impr)} &nbsp;·&nbsp; Clicks ${nf(gc.clicks)} ${deltaPlain(gc.clicks,gp.clicks)}</div>
 <h3 class="sub">Performance by campaign</h3>${camp(g.rows,'Lead form submits',{cpl:'Cost / submit',dec:1})}
 <p class="note">Lead form submits only. Course link clicks and CTA clicks are excluded. The four Train Team campaigns launched on 26 August, so August covers 6 days and September is their first full month. Figures run to 30 September and the last day may still update.</p></section>`;
h+=`<section>${head('linkedin','LinkedIn Ads','Work Based campaign group')}<div class="kpis">`+
 kpi('Spend',cur(L.tot.spend),'NZD','<span class="plain">Started 31 Aug</span>')+kpi('Impressions',nf(L.tot.impr),'','')+kpi('Clicks',nf(L.tot.clicks),'','')+kpi('CTR',pct(L.tot.clicks/L.tot.impr*100),'','')+`</div>
 <h3 class="sub">Performance by campaign</h3><div class="tw"><table><thead><tr><th>Campaign</th><th>Spend</th><th>Impr.</th><th>Clicks</th><th>CTR</th><th>Cost / click</th></tr></thead><tbody>`+
 L.rows.map(r=>`<tr><td>${r.name}</td><td>${cur(r.spend)}</td><td>${nf(r.impr)}</td><td><b>${nf(r.clicks)}</b></td><td>${pct(r.clicks/r.impr*100)}</td><td>${cur(r.spend/r.clicks,2)}</td></tr>`).join('')+
 `</tbody></table></div><p class="note">Five of the six campaigns went live on 31 August (${cur(L.aug.spend,2)} spend and ${nf(L.aug.impr)} impressions, no clicks that day) and Property Manager first delivered on 2 September, so there is no full August to compare with. LinkedIn reports zero conversions for these campaigns in September, so performance is shown as clicks.</p></section>`;
h+=`<div class="pfoot">Private &amp; Confidential<br>www.stitchtech.co</div>`;
$('#app').innerHTML=h;

</script>

</body></html>
