<style>
/* Layout: dark masthead band over a light grey ground; channel sections stacked as open blocks, each KPI row > table > creative grid. Stitch brand: no white panels, peach only on dark or as a tint. */
:root{
  --dark:#2D2D2D;--light:#F0F0F0;--peach:#ECC0AC;--orange:#E9754B;--mint:#B3E1E8;--lilac:#D7CCF2;--grey:#C0C0C0;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ink:#2D2D2D;--ink-secondary:#5d5d5d;--ink-muted:#7c7c7c;--hairline:#d9d9d9;
  --surface:transparent;--page:#F0F0F0;--cell-bg:#E6E6E6;--tile:#E9E9E9;--band:#2D2D2D;--band-fg:#F0F0F0;--band-muted:#C0C0C0;
  --meta-badge-bg:#B3E1E8;--meta-badge-text:#1f4d57;--google-badge-bg:#D7CCF2;--google-badge-text:#3f3370;
  --good-bg:#cfeee0;--good-text:#1c5a43;--warn-bg:#f7efc2;--warn-text:#6f4a1a;--critical-bg:#f6d9d6;--critical-text:#8a2f2c;
  --card-blue-bg:#B3E1E8;--card-blue-text:#1f4d57;--card-purple-bg:#D7CCF2;--card-purple-text:#3f3370;
  --card-pink-bg:#ECC0AC;--card-pink-text:#7a3f26;--card-yellow-bg:#C0C0C0;--card-yellow-text:#2D2D2D;
  --card-green-bg:#B3E1E8;--card-green-text:#1f4d57;--card-peach-bg:#ECC0AC;--card-peach-text:#7a3f26;
  --fmt-bg:rgba(240,240,240,.92);--fmt-fg:#2D2D2D;--bar-track:#d9d9d9;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#F0F0F0;--ink-secondary:#c4c4c4;--ink-muted:#9a9a9a;--hairline:#3d3d3d;--page:#232323;--cell-bg:#303030;--tile:#2b2b2b;
  --meta-badge-bg:#1f4d57;--meta-badge-text:#B3E1E8;--google-badge-bg:#3f3370;--google-badge-text:#D7CCF2;
  --good-bg:#1f3d31;--good-text:#b8ecd2;--warn-bg:#443d1c;--warn-text:#f1e3a0;--critical-bg:#4a2524;--critical-text:#f5c2be;
  --card-blue-text:#B3E1E8;--card-purple-text:#D7CCF2;--card-pink-text:#ECC0AC;--card-peach-text:#ECC0AC;--card-yellow-text:#F0F0F0;--card-green-text:#B3E1E8;
  --bar-track:#3d3d3d;color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#F0F0F0;--ink-secondary:#c4c4c4;--ink-muted:#9a9a9a;--hairline:#3d3d3d;--page:#232323;--cell-bg:#303030;--tile:#2b2b2b;
  --meta-badge-bg:#1f4d57;--meta-badge-text:#B3E1E8;--google-badge-bg:#3f3370;--google-badge-text:#D7CCF2;
  --good-bg:#1f3d31;--good-text:#b8ecd2;--warn-bg:#443d1c;--warn-text:#f1e3a0;--critical-bg:#4a2524;--critical-text:#f5c2be;
  --card-blue-text:#B3E1E8;--card-purple-text:#D7CCF2;--card-pink-text:#ECC0AC;--card-peach-text:#ECC0AC;--card-yellow-text:#F0F0F0;--card-green-text:#B3E1E8;
  --bar-track:#3d3d3d;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:24px}
.doc{max-width:960px;margin:0 auto;background:var(--surface);padding:0 0 40px}
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:32px;background:var(--band);color:var(--band-fg);border-radius:14px;padding:26px 28px}
.logo{color:var(--peach);font-weight:800;font-size:32px;letter-spacing:-.03em;line-height:1}
.mast .r{text-align:right;min-width:0}.mast .r b{display:block;font-size:17px;font-weight:700}.mast .r span{color:var(--band-muted);font-size:12px}
@media(max-width:640px){.mast{padding:20px 18px}.mast .r{text-align:left}}
section{margin-top:44px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:99px}
.badge.meta{background:var(--meta-badge-bg);color:var(--meta-badge-text)}.badge.google{background:var(--google-badge-bg);color:var(--google-badge-text)}
.head h2{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-secondary);margin:28px 0 10px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--hairline);border-radius:12px;overflow:hidden}
.kpi{padding:14px 16px;border-left:1px solid var(--hairline);min-width:0}.kpi:first-child{border-left:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .c{font-size:12px;color:var(--ink-muted);min-height:16px}
.kpi .d{margin-top:6px;font-size:12px}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--hairline)}}
.tw{overflow-x:auto;border:1px solid var(--hairline);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);text-align:right;padding:10px 10px;border-bottom:1px solid var(--hairline);white-space:nowrap;font-weight:600}
td{padding:10px 10px;border-bottom:1px solid var(--hairline);text-align:right;vertical-align:top;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:160px}
tr:last-child td{border-bottom:0}
td b{font-weight:700}
tr.tot td{font-weight:700;background:var(--tile);border-top:1px solid var(--hairline)}
.sub{display:block;font-size:11px;color:var(--ink-muted);font-weight:400;margin-top:2px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;margin-top:2px}
.pill.good{background:var(--good-bg);color:var(--good-text)}.pill.warn{background:var(--warn-bg);color:var(--warn-text)}.pill.critical{background:var(--critical-bg);color:var(--critical-text)}
.plain{font-size:11px;color:var(--ink-muted);display:block;margin-top:2px}
.muted{color:var(--ink-muted)}
.stage{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--cell-bg);color:var(--ink-secondary);margin-left:6px;white-space:nowrap}
.note{font-size:12.5px;color:var(--ink-secondary);margin:10px 0 0;max-width:80ch}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{border:1.5px solid transparent;border-radius:12px;overflow:hidden;background:var(--tile);min-width:0}
.card.top{border-color:var(--orange)}
.art{position:relative;aspect-ratio:1/1;max-width:100%;display:flex;align-items:flex-end}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:auto}
.art .fmt{position:relative;z-index:1;margin:8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:99px;background:var(--fmt-bg);color:var(--fmt-fg)}
.fmt.Video{color:#3f3370}
.rank{position:absolute;top:8px;right:8px;z-index:2;background:var(--orange);color:#2D2D2D;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px}
.cb{padding:10px 12px 12px}
.cn{font-weight:700;font-size:12.5px;line-height:1.3;margin-bottom:8px;overflow-wrap:anywhere}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini div{background:var(--cell-bg);border-radius:8px;padding:6px 8px;min-width:0}
.mini i{display:block;font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);font-weight:600}
.mini b{font-size:13.5px;font-variant-numeric:tabular-nums}
.foot{font-size:11.5px;color:var(--ink-muted);margin-top:8px}
.fs{font-size:15px;font-weight:700;margin:26px 0 12px;color:var(--ink)}
footer{margin-top:48px;padding-top:22px;border-top:1px solid var(--hairline);text-align:right;color:var(--ink-muted);font-size:12px}
</style>

const CUR='NZD';
const fmt=(n,d=0)=>n==null?'–':n.toLocaleString('en-NZ',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=(n,d=2)=>n==null?'–':'$'+fmt(n,d);
const pct=(n)=>n==null?'–':n.toFixed(2)+'%';
function pctDelta(c,p){ if(p==null||p===0) return null; return (c-p)/p*100; }
function dl(v){ return (v>=0?'+':'')+v.toFixed(1)+'%'; }
function deltaPlain(c,p,label){ if(!(p>0)) return (c>0?'<span class="plain">new vs '+label+'</span>':''); const v=pctDelta(c,p); return '<span class="plain">'+dl(v)+' vs '+label+'</span>'; }
function deltaPill(c,p,invert,label){
  if(c==null||p==null) return '';
  if(p===0&&c===0) return '';
  if(p===0) return '<span class="pill warn">new</span>';
  const v=pctDelta(c,p); let good=invert?v<-5:v>5, bad=invert?v>5:v<-5;
  return '<span class="pill '+(good?'good':bad?'critical':'warn')+'">'+dl(v)+' vs '+label+'</span>';
}
const A='Aug', S='Sep';
function agg(rows,key,filter){ const r={spend:0,impr:0,clicks:0,res:0,hasRes:false};
  rows.filter(filter||(()=>true)).forEach(x=>{const o=x[key];r.spend+=o.spend;r.impr+=o.impr;r.clicks+=o.clicks;if(o.res!=null){r.res+=o.res;r.hasRes=true}});return r;}
const ctr=o=>o.impr>0?o.clicks/o.impr*100:null;
const cpl=o=>o.res>0?o.spend/o.res:null;
function kpi(l,v,c,d){return '<div class="kpi"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="c">'+(c||'')+'</div><div class="d">'+(d||'')+'</div></div>';}
function kpiRow(rows,leadFilter,resLabel,cplLabel,cplCap,spendCap){
  const a=agg(rows,'aug'), s=agg(rows,'sep'), al=agg(rows,'aug',leadFilter), sl=agg(rows,'sep',leadFilter);
  return '<div class="kpis">'+
   kpi('Spend',money(s.spend),spendCap,deltaPlain(s.spend,a.spend,A))+
   kpi('Impressions',fmt(s.impr),'CTR '+pct(ctr(s)),deltaPlain(s.impr,a.impr,A))+
   kpi(resLabel,fmt(sl.res,sl.res%1?1:0),'',deltaPill(sl.res,al.res,false,A))+
   kpi(cplLabel,money(cpl(sl)),cplCap,deltaPill(cpl(sl),cpl(al),true,A))+'</div>';
}
function resCell(o,p,lead){ // leads cell with delta
  if(o.res==null) return '<span class="muted">–</span>';
  return '<b>'+fmt(o.res,o.res%1?1:0)+'</b>'+(lead?deltaPill(o.res,p.res,false,A):'');
}
function campRow(c,opts){
  const s=c.sep,a=c.aug; const none=s.spend===0;
  const nm=c.name+(c.stage&&opts.stage?'<span class="stage">'+c.stage+'</span>':'');
  if(none) return '<tr><td>'+nm+'<span class="sub">No delivery in September (August spend '+money(a.spend)+')</span></td><td>$0.00</td><td>–</td><td>–</td><td>–</td><td>–</td><td>–</td></tr>';
  const lead=c.lead!==false;
  return '<tr><td>'+nm+'</td>'+
   '<td>'+money(s.spend)+deltaPlain(s.spend,a.spend,A)+'</td>'+
   '<td>'+fmt(s.impr)+deltaPlain(s.impr,a.impr,A)+'</td>'+
   '<td>'+fmt(s.clicks)+deltaPlain(s.clicks,a.clicks,A)+'</td>'+
   '<td>'+pct(ctr(s))+deltaPill(ctr(s),ctr(a),false,A)+'</td>'+
   '<td>'+(lead?resCell(s,a,true):'<span class="muted">–</span>')+'</td>'+
   '<td>'+(lead&&s.res>0?'<b>'+money(cpl(s))+'</b>'+deltaPill(cpl(s),cpl(a),true,A):'<span class="muted">–</span>')+'</td></tr>';
}
function table(heads,body,total){return '<div class="tw"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+body+(total||'')+'</tbody></table></div>';}
function totalRow(rows,leadFilter,resLbl){
  const s=agg(rows,'sep'),a=agg(rows,'aug'),sl=agg(rows,'sep',leadFilter),al=agg(rows,'aug',leadFilter);
  return '<tr class="tot"><td>Total</td><td>'+money(s.spend)+deltaPlain(s.spend,a.spend,A)+'</td><td>'+fmt(s.impr)+deltaPlain(s.impr,a.impr,A)+'</td><td>'+fmt(s.clicks)+deltaPlain(s.clicks,a.clicks,A)+'</td><td>'+pct(ctr(s))+deltaPill(ctr(s),ctr(a),false,A)+'</td><td>'+fmt(sl.res,sl.res%1?1:0)+deltaPill(sl.res,al.res,false,A)+'</td><td>'+money(cpl(sl))+deltaPill(cpl(sl),cpl(al),true,A)+'</td></tr>';
}
const ART=[['blue'],['purple'],['pink'],['blue'],['purple'],['yellow'],['green'],['peach']];
function cardHTML(c,i,ranked){
  const col=ART[i%8][0];
  const top=ranked.has(c)?ranked.get(c):0;
  const hasL=c.leads!=null;
  const cplv=hasL&&c.leads>0?c.spend/c.leads:null;
  const ct=c.impr>0?c.clicks/c.impr*100:null;
  return '<div class="card'+(top?' top':'')+'"><div class="art" style="background:var(--card-'+col+'-bg)"><img src="data:image/jpeg;base64,'+c.img+'" alt="'+c.name.replace(/"/g,'')+'" loading="lazy">'+(top?'<span class="rank">#'+top+'</span>':'')+'<span class="fmt '+c.type+'">'+c.type+'</span></div>'+
   '<div class="cb"><div class="cn">'+c.name+'</div><div class="mini"><div><i>Spend</i><b>'+money(c.spend)+'</b></div><div><i>Leads</i><b>'+(hasL?fmt(c.leads):'–')+'</b></div><div><i>CPL</i><b>'+(cplv?money(cplv):'–')+'</b></div><div><i>CTR</i><b>'+pct(ct)+'</b></div></div>'+
   '<div class="foot">'+fmt(c.impr)+' impr · '+fmt(c.clicks)+' clicks'+(c.note?' · '+c.note:'')+'</div></div></div>';
}
function rankMap(cards){ // top 3 by leads then spend, only cards with leads>0, only if >3 cards
  const m=new Map(); if(cards.length<=3) return m;
  const s=cards.filter(c=>c.leads>0).sort((a,b)=>b.leads-a.leads||b.spend-a.spend).slice(0,3);
  s.forEach((c,i)=>m.set(c,i+1)); return m;
}
function sortCards(cs){return cs.slice().sort((a,b)=>((b.leads||0)-(a.leads||0))||(b.spend-a.spend));}
function grid(cards){const cs=sortCards(cards);const r=rankMap(cs);return '<div class="grid">'+cs.map((c,i)=>cardHTML(c,i,r)).join('')+'</div>';}

// GOOGLE
const grows=D.google;
h+='<section><div class="head"><span class="badge google">Google Ads</span><h2>Search, Performance Max &amp; Video</h2></div>';
h+=kpiRow(grows,()=>true,'Lead Form Submits','Cost per Lead Form Submit','','NZD');
h+='<h3>Campaigns</h3>';
function gRow(c){const s=c.sep,a=c.aug;
 return '<tr><td>'+c.name+'</td><td>'+money(s.spend)+deltaPlain(s.spend,a.spend,A)+'</td><td>'+fmt(s.impr)+deltaPlain(s.impr,a.impr,A)+'</td><td>'+fmt(s.clicks)+deltaPlain(s.clicks,a.clicks,A)+'</td><td>'+pct(ctr(s))+deltaPill(ctr(s),ctr(a),false,A)+'</td><td>'+(s.res>0||a.res>0?'<b>'+fmt(s.res,1)+'</b>'+deltaPill(s.res,a.res,false,A):'<span class="muted">0</span>')+'</td><td>'+(s.res>0?'<b>'+money(cpl(s))+'</b>'+deltaPill(cpl(s),cpl(a),true,A):'<span class="muted">–</span>')+'</td></tr>';}
const gs=agg(grows,'sep'),ga=agg(grows,'aug');
const gtot='<tr class="tot"><td>Total</td><td>'+money(gs.spend)+deltaPlain(gs.spend,ga.spend,A)+'</td><td>'+fmt(gs.impr)+deltaPlain(gs.impr,ga.impr,A)+'</td><td>'+fmt(gs.clicks)+deltaPlain(gs.clicks,ga.clicks,A)+'</td><td>'+pct(ctr(gs))+deltaPill(ctr(gs),ctr(ga),false,A)+'</td><td>'+fmt(gs.res,1)+deltaPill(gs.res,ga.res,false,A)+'</td><td>'+money(cpl(gs))+deltaPill(cpl(gs),cpl(ga),true,A)+'</td></tr>';
h+=table(['Campaign','Spend','Impressions','Clicks','CTR','Lead Form Submits','Cost per submit'],grows.map(gRow).join(''),gtot);
if(D.types){
  h+='<h3>Lead form submits by type</h3>';
  h+=table(['Form','August','September','Change'],D.types.map(([n,v])=>'<tr><td>'+n+'</td><td>'+fmt(v.aug,1)+'</td><td><b>'+fmt(v.sep,1)+'</b></td><td>'+deltaPill(v.sep,v.aug,false,A)+'</td></tr>').join(''));
  if(D.google_note) h+='<p class="note">'+D.google_note+'</p>';
}
h+='</section>';
h+='<footer>Private &amp; Confidential<br>www.stitchtech.co</footer>';
document.getElementById('root').innerHTML=h;
</script>


</body></html>
