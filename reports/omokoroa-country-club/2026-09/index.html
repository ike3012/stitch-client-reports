<style>
/* Layout: dark masthead band, single 960px column on light grey ground, channel sections as open blocks with hairline rules (no white panels, peach only on dark or as tinted fills) */
:root{
  --dark:#2D2D2D; --light:#F0F0F0; --peach:#ECC0AC; --orange:#E9754B; --mint:#B3E1E8; --lilac:#D7CCF2; --grey:#C0C0C0;
  --bg:#F0F0F0; --fg:#2D2D2D; --fg2:#5d5d5d; --muted:#7c7c7c; --line:#d9d9d9; --cell:#E6E6E6; --band:#2D2D2D; --band-fg:#F0F0F0;
  --tile:#E9E9E9;
  --good-bg:#cfeee0; --good-fg:#1c5a43; --warn-bg:#f7efc2; --warn-fg:#6f4a1a; --crit-bg:#f6d9d6; --crit-fg:#8a2f2c;
  --meta-bg:#B3E1E8; --meta-fg:#1f4d57; --goog-bg:#D7CCF2; --goog-fg:#3f3370;
  --art1:#B3E1E8; --art2:#D7CCF2; --art3:#ECC0AC;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#232323; --fg:#F0F0F0; --fg2:#c4c4c4; --muted:#9a9a9a; --line:#3d3d3d; --cell:#303030; --band:#2D2D2D; --band-fg:#F0F0F0; --tile:#2b2b2b;
  --good-bg:#1f3d31; --good-fg:#b8ecd2; --warn-bg:#443d1c; --warn-fg:#f1e3a0; --crit-bg:#4a2524; --crit-fg:#f5c2be;
  --meta-bg:#1f4d57; --meta-fg:#B3E1E8; --goog-bg:#3f3370; --goog-fg:#D7CCF2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#232323; --fg:#F0F0F0; --fg2:#c4c4c4; --muted:#9a9a9a; --line:#3d3d3d; --cell:#303030; --band:#2D2D2D; --band-fg:#F0F0F0; --tile:#2b2b2b;
  --good-bg:#1f3d31; --good-fg:#b8ecd2; --warn-bg:#443d1c; --warn-fg:#f1e3a0; --crit-bg:#4a2524; --crit-fg:#f5c2be;
  --meta-bg:#1f4d57; --meta-fg:#B3E1E8; --goog-bg:#3f3370; --goog-fg:#D7CCF2; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;margin:0}
.band{background:var(--band);color:var(--band-fg)}
.wrap{max-width:960px;margin:0 auto;padding-inline:20px}
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:26px}
.logo{font-size:32px;font-weight:800;letter-spacing:-.03em;color:var(--peach);line-height:1}
.mast .r{text-align:right}.mast .r b{display:block;font-size:17px;font-weight:700}.mast .r span{font-size:12px;color:#c0c0c0}
main{padding-block:28px 40px;display:flex;flex-direction:column;gap:44px}
h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin:0 0 4px;color:var(--fg2)}
h3{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:99px}
.badge.meta{background:var(--meta-bg);color:var(--meta-fg)}.badge.goog{background:var(--goog-bg);color:var(--goog-fg)}.badge.comb{background:var(--dark);color:var(--peach)}
.sub{color:var(--fg2);font-size:13px;margin:0 0 14px;max-width:70ch}
.note{font-size:12.5px;color:var(--fg2);margin:10px 0 0;max-width:80ch}
.explain{background:var(--tile);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--fg2);margin-bottom:16px;max-width:80ch}
.explain b{color:var(--fg)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{padding:14px 16px;border-left:1px solid var(--line);min-width:0}.kpi:first-child{border-left:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .c{font-size:12px;color:var(--muted);min-height:18px}
.kpi .d{margin-top:6px;font-size:12px;min-height:22px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:18px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:180px}
tr:last-child td{border-bottom:0}tr.tot td{font-weight:700;background:var(--tile)}
td.muted,.mutedrow td{color:var(--muted)}
.cap{margin:22px 0 0;font-size:14px;font-weight:700}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good-fg)}.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}.pill.critical{background:var(--crit-bg);color:var(--crit-fg)}
.plain{color:var(--muted);font-size:12px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum .col{padding:14px 16px;border-left:1px solid var(--line);min-width:0}.sum .col:first-child{border-left:0}
.sum .nm{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.sum .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:5px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.sum .row:first-of-type{border-top:0}.sum .row .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.sum .row .n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.sum .row .dd{flex-basis:100%;text-align:right;font-size:12px}
.stage{margin:26px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.stage b{font-size:15px}.stage span{font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--tile);border-radius:12px;overflow:hidden;border:1.5px solid transparent;min-width:0;display:flex;flex-direction:column}
.card.top{border-color:var(--orange)}
.art{position:relative;aspect-ratio:1/1;display:flex;align-items:flex-end;padding:8px}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art .fmt{position:relative;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:rgba(240,240,240,.92);color:#2D2D2D;padding:2px 8px;border-radius:99px}
.art .fmt.v{color:#3f3370}
.rank{position:absolute;top:8px;right:8px;background:var(--orange);color:#2D2D2D;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.cb .n{font-weight:700;font-size:12.5px;line-height:1.3;min-height:2.6em;overflow-wrap:anywhere}
.m{display:grid;grid-template-columns:1fr 1fr;gap:6px}.m div{background:var(--cell);border-radius:8px;padding:6px 8px}
.m i{display:block;font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}.m b{font-size:13.5px;font-variant-numeric:tabular-nums}
.foot{font-size:11.5px;color:var(--muted)}
footer{padding-block:22px;text-align:right;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}
@media(max-width:640px){.sum{grid-template-columns:1fr}.sum .col{border-left:0;border-top:1px solid var(--line)}.sum .col:first-child{border-top:0}.mast .r{text-align:left}}
@media(max-width:420px){.grid{grid-template-columns:1fr 1fr;gap:10px}.kpi .v{font-size:22px}}
</style>

<div class="explain" style="margin-top:18px"><b>TOF</b> = Top of Funnel: prospecting campaigns that reach new people who haven't engaged yet. <b>BOF</b> = Bottom of Funnel: remarketing to people who have already visited or engaged. Labels come from the campaign names.</div>`;
function metaRow(r){
 if(!r.c) return `<tr class="mutedrow"><td>${r.n}<br><span class="plain">Stage: ${r.stage}. No delivery in September (${r.p.res} RSVPs in August)</span></td><td>$0.00</td><td>–</td><td>–</td><td>–</td><td>–</td><td>–</td><td>–</td><td>–</td></tr>`;
 const c=r.c,p=r.p;
 return `<tr><td>${r.n}<br><span class="plain">${r.stage}</span></td><td>${nzd(c.spend)}<br>${dplain(c.spend,p.spend)}</td><td>${num(c.impr)}</td><td>${num(c.clicks)}</td><td>${pct(c.ctr)}<br>${dpill(c.ctr,p.ctr,false)}</td><td><b>${c.res}</b> ${r.unit}<br>${dpill(c.res,p.res,false)}</td><td>${nzd(cpl(c.spend,c.res))}<br>${dpill(cpl(c.spend,c.res),cpl(p.spend,p.res),true)}</td></tr>`}
h+=`<div class="tw"><table><thead><tr><th>Campaign</th><th>Spend (Δ vs Aug)</th><th>Impr.</th><th>Clicks</th><th>CTR (vs Aug)</th><th>Result (vs Aug)</th><th>Cost / result (vs Aug)</th></tr></thead><tbody>
${D.metaCamps.map(r=>r.c?metaRow(r):`<tr class="mutedrow"><td>${r.n}<br><span class="plain">Event. No delivery in September (15 RSVPs in August)</span></td><td>$0.00</td><td>–</td><td>–</td><td>–</td><td>–</td><td>–</td></tr>`).join('')}
<tr class="tot"><td>Account total</td><td>${nzd(mc.spend)}</td><td>${num(mc.impr)}</td><td>${num(mc.clicks)}</td><td>${pct(mc.ctr)}</td><td>${mc.leads} leads</td><td>${nzd(cpl(mc.spend,mc.leads))}</td></tr></tbody></table></div>
<p class="note">Account-wide September website leads fell from 29 to 8 on near-flat spend. Most of the drop sits in the TOF Advantage Plus campaign (10 to 1) and BOF remarketing (19 to 7). The Event Promotion campaign ran in August only (15 RSVPs), so it is not in the September figures.</p>`;
// creatives
const order=(a,b)=>((b.leads||0)-(a.leads||0))||(b.spend-a.spend);
const sorted=[...ADS].sort(order);
sorted.filter(a=>a.leads).slice(0,3).forEach(a=>a.rank=true);
const rk=sorted.filter(a=>a.rank);rk.forEach((a,i)=>a.rk=i+1);
const arts=['var(--art1)','var(--art2)','var(--art3)'];
function card(a,i){const cp=a.leads?a.spend/a.leads:null;
 return `<div class="card ${a.rank?'top':''}"><div class="art" style="background:${arts[i%3]}"><img src="${a.img}" alt="${a.name}">${a.rank?`<span class="rank">#${a.rk}</span>`:''}<span class="fmt ${a.fmt==='Video'?'v':''}">${a.fmt}</span></div>
 <div class="cb"><div class="n">${a.name}</div><div class="m"><div><i>Spend</i><b>${nzd(a.spend)}</b></div><div><i>Leads</i><b>${a.leads==null?'–':a.leads}</b></div><div><i>Cost / lead</i><b>${cp?nzd(cp):'–'}</b></div><div><i>CTR</i><b>${pct(a.ctr)}</b></div></div>
 <div class="foot">${num(a.impr)} impr. | ${num(a.clicks)} clicks</div></div></div>`}
h+=`<h4 class="cap">Ad creatives, September</h4><p class="sub">Ranked by website leads, then spend. Ads under $10 of spend are left out. Lead counts show "–" where Meta does not attribute results at ad level.</p>`;
[['BOF','Bottom of Funnel','Remarketing ads'],['TOF','Top of Funnel','Prospecting ads']].forEach(([s,t,d])=>{
 const list=sorted.filter(a=>a.stage===s);
 h+=`<div class="stage"><b>${t}</b><span>${d}</span></div><div class="grid">${list.map(card).join('')}</div>`});
h+=`</section>`;
// Google
h+=`<section><div class="head"><span class="badge goog">Google Ads</span><h3>Search &amp; Performance Max</h3></div>
<div class="kpis">${kpi('Spend',nzd(gc.spend),'NZD',dplain(gc.spend,gp.spend))}
${kpi('Clicks',num(gc.clicks),num(gc.impr)+' impressions',dplain(gc.clicks,gp.clicks))}
${kpi('CTR',pct(gc.clicks/gc.impr*100),'Avg CPC '+nzd(gc.spend/gc.clicks),dpill(gc.clicks/gc.impr,gp.clicks/gp.impr,false))}
${kpi('Lead form submits',num(gc.lfs,1),'Avg '+nzd(gc.spend/gc.lfs)+' per submit',dpillL(gc.lfs,gp.lfs,false))}</div>`;
h+=`<div class="tw"><table><thead><tr><th>Campaign</th><th>Spend (Δ vs Aug)</th><th>Impr.</th><th>Clicks</th><th>CTR (vs Aug)</th><th>Lead form submits (vs Aug)</th><th>Cost / submit (vs Aug)</th></tr></thead><tbody>
${D.gCamps.map(r=>{const c=r.c,p=r.p;const ctr=c.clicks/c.impr*100,pc=p.clicks/p.impr*100;
 return `<tr><td>${r.n}</td><td>${nzd(c.spend)}<br>${dplain(c.spend,p.spend)}</td><td>${num(c.impr)}</td><td>${num(c.clicks)}</td><td>${pct(ctr)}<br>${dpill(ctr,pc,false)}</td><td><b>${num(c.lfs,1)}</b><br>${dpill(c.lfs,p.lfs,false)}</td><td>${nzd(cpl(c.spend,c.lfs))}<br>${dpill(cpl(c.spend,c.lfs),cpl(p.spend,p.lfs),true)}</td></tr>`}).join('')}
<tr class="tot"><td>Account total</td><td>${nzd(gc.spend)}</td><td>${num(gc.impr)}</td><td>${num(gc.clicks)}</td><td>${pct(gc.clicks/gc.impr*100)}</td><td>${num(gc.lfs,1)}</td><td>${nzd(gc.spend/gc.lfs)}</td></tr></tbody></table></div>
<p class="note">Spend rose 20% while lead form submits fell from 17 to 12. Non-Brand spend grew 47% (to $1,614) and its submits dropped from 8 to 3, which accounts for most of the decline.</p>`;
h+=`<h4 class="cap">Conversions by action</h4>
<div class="tw"><table><thead><tr><th>Conversion action</th><th>Category</th><th>September</th><th>August</th><th>Change</th></tr></thead><tbody>
${D.gTypes.map(t=>`<tr class="${t.counted?'':'mutedrow'}"><td>${t.counted?'<b>'+t.n+'</b>':t.n}</td><td>${t.cat}</td><td>${num(t.c,1)}</td><td>${num(t.p,1)}</td><td>${t.counted?dpill(t.c,t.p,false):dplain(t.c,t.p).replace(' vs Aug','')}</td></tr>`).join('')}</tbody></table></div>
<p class="note">Only lead form submits count as conversions. Brochure downloads, email clicks and phone clicks are shown for reference and are not in the lead figures above.</p>
<h4 class="cap">September actions by campaign</h4>
<div class="tw"><table><thead><tr><th>Campaign</th><th>Lead form submits</th><th>Brochure downloads</th><th>Email clicks</th><th>Phone clicks</th></tr></thead><tbody>
${D.gSplit.map(r=>`<tr><td>${r[0]}</td><td><b>${num(r[1],1)}</b></td><td class="muted">${num(r[2],1)}</td><td class="muted">${num(r[3],1)}</td><td class="muted">${num(r[4],1)}</td></tr>`).join('')}
<tr class="tot"><td>Total</td><td>${num(D.gSplit.reduce((s,r)=>s+r[1],0),1)}</td><td>${num(D.gSplit.reduce((s,r)=>s+r[2],0),1)}</td><td>${num(D.gSplit.reduce((s,r)=>s+r[3],0),1)}</td><td>${num(D.gSplit.reduce((s,r)=>s+r[4],0),1)}</td></tr></tbody></table></div></section>`;
app.innerHTML=h;
</script>
