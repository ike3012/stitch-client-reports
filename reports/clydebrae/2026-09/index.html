<style>
/* Layout: single centred 900px document panel, channel sections stacked (Stitch brand kit) */
:root{
--peach:#ECC0AC;--brand-orange:#E9754B;--ink:#2D2D2D;--ink-secondary:#5a5a5a;--ink-muted:#7c7c7c;--hairline:#e2e2e2;--surface:#ffffff;--page:#F0F0F0;--cell-bg:#F6F6F6;
--meta-badge-bg:#B3E1E8;--meta-badge-text:#1f4d57;--google-badge-bg:#D7CCF2;--google-badge-text:#3f3370;
--good-bg:#D7F9E6;--good-text:#1F5C46;--warn-bg:#FEF9C8;--warn-text:#80501D;--critical-bg:#FBE3E3;--critical-text:#8C3232;
--card-blue-bg:#DCEFF2;--card-blue-text:#1f4d57;--card-purple-bg:#ECE6F9;--card-purple-text:#3f3370;--card-pink-bg:#ECE6F9;--card-yellow-bg:#ECECEC;--card-green-bg:#DCEFF2;--card-peach-bg:#ECECEC;
--bar-track:#F0F0F0;
--font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--mast-bg:#2D2D2D;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#F0F0F0;--ink-secondary:#c4c4c4;--ink-muted:#9a9a9a;--hairline:#444444;--surface:#2D2D2D;--page:#1e1e1e;--cell-bg:#363636;
--meta-badge-bg:#1f4d57;--meta-badge-text:#B3E1E8;--google-badge-bg:#3f3370;--google-badge-text:#D7CCF2;
--good-bg:#1d4a38;--good-text:#b5f0d2;--warn-bg:#4a4418;--warn-text:#f3e3a0;--critical-bg:#5a2a2a;--critical-text:#f6c4c4;
--card-blue-bg:#2F4447;--card-purple-bg:#3B3550;--card-pink-bg:#3B3550;--card-yellow-bg:#3A3A3A;--card-green-bg:#2F4447;--card-peach-bg:#3A3A3A;--bar-track:#3a3a3a;--card-blue-text:#B3E1E8;--card-purple-text:#D7CCF2;color-scheme:dark;--mast-bg:#161616;}}
:root[data-theme="dark"]{--ink:#F0F0F0;--ink-secondary:#c4c4c4;--ink-muted:#9a9a9a;--hairline:#444444;--surface:#2D2D2D;--page:#1e1e1e;--cell-bg:#363636;
--meta-badge-bg:#1f4d57;--meta-badge-text:#B3E1E8;--google-badge-bg:#3f3370;--google-badge-text:#D7CCF2;
--good-bg:#1d4a38;--good-text:#b5f0d2;--warn-bg:#4a4418;--warn-text:#f3e3a0;--critical-bg:#5a2a2a;--critical-text:#f6c4c4;
--card-blue-bg:#2F4447;--card-purple-bg:#3B3550;--card-pink-bg:#3B3550;--card-yellow-bg:#3A3A3A;--card-green-bg:#2F4447;--card-peach-bg:#3A3A3A;--bar-track:#3a3a3a;--card-blue-text:#B3E1E8;--card-purple-text:#D7CCF2;color-scheme:dark;--mast-bg:#161616;}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:24px}
.doc{max-width:900px;margin:0 auto;background:var(--surface);border-radius:14px;padding:40px 48px 56px}
.mast{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.logo{color:var(--peach);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1}
.mast .r{text-align:right}.mast .r b{display:block;font-size:16px}.mast .r span{color:var(--ink-muted);font-size:12px}
.sec{margin-top:36px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:999px}
.badge.meta{background:var(--meta-badge-bg);color:var(--meta-badge-text)}.badge.google{background:var(--google-badge-bg);color:var(--google-badge-text)}
.head h2{font-size:18px;margin:0;text-wrap:balance}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--hairline);border-radius:12px;overflow:hidden}
.kpi{padding:14px 16px;border-left:1px solid var(--hairline);min-width:0}.kpi:first-child{border-left:0}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-muted);font-weight:600}
.kpi .v{font-size:25px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .c{font-size:11.5px;color:var(--ink-muted);min-height:16px}
.kpi .d{margin-top:6px;font-size:11.5px;color:var(--ink-secondary)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good-text)}.pill.warn{background:var(--warn-bg);color:var(--warn-text)}.pill.critical{background:var(--critical-bg);color:var(--critical-text)}
h3{font-size:13px;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-secondary)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12.5px}
th{text-align:right;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--hairline);white-space:nowrap}
td{text-align:right;padding:10px 8px;border-bottom:1px solid var(--hairline);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:150px}
td.n{font-weight:700}.muted{color:var(--ink-muted);font-size:11.5px}
tr.tot td{font-weight:700;border-top:1.5px solid var(--hairline)}
.note{font-size:12px;color:var(--ink-secondary);margin:10px 0 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{border:1px solid var(--hairline);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0}
.card.top{border:1.5px solid var(--brand-orange)}
.art{position:relative;aspect-ratio:16/10;display:flex;align-items:flex-end}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rank{position:absolute;top:8px;right:8px;background:var(--brand-orange);color:#2D2D2D;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.fmt{position:relative;margin:0 0 8px 8px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--card-blue-text);background:var(--surface);padding:2px 7px;border-radius:999px}
.body{padding:10px 10px 12px}.body b{display:block;font-size:12.5px;margin-bottom:8px;overflow-wrap:anywhere}
.mc{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mc div{background:var(--cell-bg);border-radius:8px;padding:6px 8px}.mc i{display:block;font-style:normal;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted)}.mc span{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.foot{margin-top:8px;font-size:10.5px;color:var(--ink-muted)}
.footer{margin-top:48px;text-align:right;color:var(--ink-muted);font-size:11.5px}
@media(max-width:760px){.doc{padding:24px 18px 36px}.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--hairline)}.grid{grid-template-columns:1fr 1fr}.mast .r{text-align:left}}
@media(max-width:420px){.grid{grid-template-columns:1fr}}

/* Stitch brand: dark masthead band, peach wordmark */
.mast{background:var(--mast-bg);color:#F0F0F0;margin:-40px -48px 28px;padding:28px 48px;border-radius:inherit;border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:0;align-items:flex-end}
.mast .logo{color:#ECC0AC;font-size:32px;letter-spacing:-.03em;line-height:1}
.mast .r b{color:#F0F0F0}.mast .r span{color:#C0C0C0}
@media(max-width:760px){.mast{margin:-24px -18px 22px;padding:22px 18px}}
</style>

const ads=ADS.filter(a=>a.spend>=10).sort((a,b)=>b.leads-a.leads||b.spend-a.spend);
h+=`<div class="grid">`+ads.map((a,i)=>{const top=i<3&&a.leads>0;const bg=["blue","purple","pink","blue","purple","yellow","green","peach"][i%8];
return `<div class="card${top?" top":""}"><div class="art" style="background:var(--card-${bg}-bg)"><img src="${IMG}" alt="${a.n} ad creative">${top?`<span class="rank">#${i+1}</span>`:""}<span class="fmt">Static</span></div><div class="body"><b>${a.n}</b><div class="mc"><div><i>Spend</i><span>${$(a.spend)}</span></div><div><i>Leads</i><span>${a.leads}</span></div><div><i>CPL</i><span>${a.leads?$(a.spend/a.leads):"–"}</span></div><div><i>CTR</i><span>${P(a.clicks/a.impr)}</span></div></div><div class="foot">${N(a.impr)} impr. · ${N(a.clicks)} clicks</div></div></div>`}).join("")+`</div>`;
h+=`<p class="note">Ad names run across more than one ad set and are combined here. Ads are ranked by leads, then spend. Meta returns the same streetscape preview image for every ad in the account.</p>`;
document.getElementById("meta").innerHTML=h})();
// GOOGLE
(function(){
const c=G.cur,p=G.prev,cc=c.spend/c.lfs,cp=p.spend/p.lfs;
let h=`<div class="head"><span class="badge google">Google Ads</span><h2>Search &amp; Performance Max</h2></div>`;
h+=kpis([["Spend",$(c.spend),"NZD",plain(c.spend,p.spend)],["Clicks",N(c.clicks),"CTR "+P(c.clicks/c.impr),plain(c.clicks,p.clicks)],["Lead form submits",N(c.lfs),"",pill(c.lfs,p.lfs)+" vs Aug"],["Cost per lead form submit",$(cc),"",pill(cc,cp,true)+" vs Aug"]]);
h+=`<h3>Campaigns</h3><div class="tw"><table><tr><th>Campaign</th><th>Spend</th><th>Impr.</th><th>Clicks</th><th>CTR</th><th>Lead form submits</th><th>Cost / submit</th><th>Spend (vs Aug)</th><th>Submits (vs Aug)</th><th>Cost (vs Aug)</th></tr>`;
GC.forEach(r=>{const a=r.cur,b=r.prev,x=a.spend/a.lfs,y=b.spend/b.lfs;
h+=`<tr><td>${r.n}<div class="muted">${r.st}</div></td><td>${$(a.spend)}</td><td>${N(a.impr)}</td><td>${N(a.clicks)}</td><td>${P(a.clicks/a.impr)}</td><td class="n">${a.lfs}</td><td>${$(x)}</td><td>${dl(pd(a.spend,b.spend))}</td><td>${pill(a.lfs,b.lfs)}</td><td>${pill(x,y,true)}</td></tr>`});
h+=`<tr class="tot"><td>Total</td><td>${$(c.spend)}</td><td>${N(c.impr)}</td><td>${N(c.clicks)}</td><td>${P(c.clicks/c.impr)}</td><td>${c.lfs}</td><td>${$(cc)}</td><td>${dl(pd(c.spend,p.spend))}</td><td>${pill(c.lfs,p.lfs)}</td><td>${pill(cc,cp,true)}</td></tr></table></div>`;
h+=`<h3>Lead form submits by type</h3><div class="tw"><table><tr><th>Form</th><th>September</th><th>August</th></tr>`+GT.map(t=>`<tr><td>${t[0]}</td><td class="n">${t[1]}</td><td>${t[2]}</td></tr>`).join("")+`<tr class="tot"><td>Total</td><td>${c.lfs}</td><td>${p.lfs}</td></tr></table></div>`;
h+=`<p class="note">Only lead form submit actions are counted. Pmax Properties is paused as of 30 September and delivered most of the month's spend before that.</p>`;
document.getElementById("google").innerHTML=h})();
</script>
