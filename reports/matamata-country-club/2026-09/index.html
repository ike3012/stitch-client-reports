<title>Matamata Country Club Report</title>

<style>
/* Layout: single 900px document panel, masthead, channel sections (Meta, Google), footer. Stitch brand kit. */
:root{
  --peach:#ECC0AC;--brand-orange:#E9754B;
  --ink:#2D2D2D;--ink-secondary:#5a5a5a;--ink-muted:#7c7c7c;--hairline:#e2e2e2;
  --surface:#ffffff;--page:#F0F0F0;--cell-bg:#F6F6F6;
  --meta-badge-bg:#B3E1E8;--meta-badge-text:#1f4d57;
  --google-badge-bg:#D7CCF2;--google-badge-text:#3f3370;
  --good-bg:#D7F9E6;--good-text:#1F5C46;--warn-bg:#FEF9C8;--warn-text:#80501D;--critical-bg:#FBE3E3;--critical-text:#8C3232;
  --card-blue-bg:#DCEFF2;--card-blue-text:#1f4d57;--card-purple-bg:#ECE6F9;--card-purple-text:#3f3370;
  --card-pink-bg:#ECE6F9;--card-pink-text:#3f3370;--card-yellow-bg:#ECECEC;--card-yellow-text:#5a5a5a;
  --card-green-bg:#DCEFF2;--card-green-text:#1f4d57;--card-peach-bg:#ECECEC;--card-peach-text:#5a5a5a;
  --bar-track:#F0F0F0;
  --font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--mast-bg:#2D2D2D;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#F0F0F0;--ink-secondary:#c4c4c4;--ink-muted:#9a9a9a;--hairline:#444444;--surface:#2D2D2D;--page:#1e1e1e;--cell-bg:#363636;
  --meta-badge-bg:#1f4d57;--meta-badge-text:#B3E1E8;--google-badge-bg:#3f3370;--google-badge-text:#D7CCF2;
  --good-bg:#17402f;--good-text:#8fe0b9;--warn-bg:#4a4413;--warn-text:#f0dc8a;--critical-bg:#512424;--critical-text:#f3a6a6;
  --bar-track:#3a3a3a;color-scheme:dark;--mast-bg:#161616;}}
:root[data-theme="dark"]{
  --ink:#F0F0F0;--ink-secondary:#c4c4c4;--ink-muted:#9a9a9a;--hairline:#444444;--surface:#2D2D2D;--page:#1e1e1e;--cell-bg:#363636;
  --meta-badge-bg:#1f4d57;--meta-badge-text:#B3E1E8;--google-badge-bg:#3f3370;--google-badge-text:#D7CCF2;
  --good-bg:#17402f;--good-text:#8fe0b9;--warn-bg:#4a4413;--warn-text:#f0dc8a;--critical-bg:#512424;--critical-text:#f3a6a6;
  --bar-track:#3a3a3a;color-scheme:dark;--mast-bg:#161616;}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:24px}
.doc{max-width:900px;margin:0 auto;background:var(--surface);border-radius:14px;padding:40px 48px 56px}
.mast{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--hairline)}
.logo{font-weight:800;font-size:30px;letter-spacing:-.02em;color:var(--peach);line-height:1}
.mast .r{text-align:right}.mast .r b{display:block;font-size:16px}.mast .r span{display:block;color:var(--ink-muted);font-size:12px;margin-top:2px}
h2{font-size:18px;margin:0}
.sum{margin-top:24px;border:1px solid var(--hairline);border-radius:12px;padding:18px 20px}
.sum h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted)}
.sum ul{margin:0;padding-left:18px;display:grid;gap:5px}
.section{margin-top:40px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:999px}
.badge.meta{background:var(--meta-badge-bg);color:var(--meta-badge-text)}.badge.google{background:var(--google-badge-bg);color:var(--google-badge-text)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--hairline);border-radius:12px;overflow:hidden}
.kpi{padding:14px 16px;border-left:1px solid var(--hairline);min-width:0}.kpi:first-child{border-left:0}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);font-weight:600}
.kpi .v{font-size:25px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .c{font-size:11.5px;color:var(--ink-muted);min-height:16px}
.kpi .d{font-size:11.5px;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;color:var(--ink-secondary)}
h4{font-size:13px;margin:26px 0 8px;font-weight:700}
.note{font-size:12px;color:var(--ink-muted);margin:8px 0 0}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);text-align:right;padding:8px 8px;border-bottom:1px solid var(--hairline);font-weight:600;white-space:nowrap}
td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--hairline);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:170px}
td.b{font-weight:700}tr.tot td{font-weight:700;border-top:1.5px solid var(--ink-muted)}
.muted{color:var(--ink-muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill.good{background:var(--good-bg);color:var(--good-text)}.pill.warn{background:var(--warn-bg);color:var(--warn-text)}.pill.critical{background:var(--critical-bg);color:var(--critical-text)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{border:1px solid var(--hairline);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;min-width:0}
.card.top{border:1.5px solid var(--brand-orange)}
.art{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.rank{position:absolute;top:8px;right:8px;background:var(--brand-orange);color:#2D2D2D;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
.fmt{font-size:11px;font-weight:700;padding:8px 10px 0}
.fmt.static{color:var(--card-blue-text)}.fmt.video{color:var(--card-purple-text)}
.cb{padding:2px 10px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.cb .n{font-weight:700;font-size:12.5px;line-height:1.3;overflow-wrap:anywhere}
.m{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.m div{background:var(--cell-bg);border-radius:7px;padding:5px 7px;min-width:0}
.m span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted)}
.m b{font-size:13px;font-variant-numeric:tabular-nums}
.foot{font-size:11px;color:var(--ink-muted);margin-top:auto}
.bgb-blue{background:var(--card-blue-bg)}.bgb-purple{background:var(--card-purple-bg)}.bgb-pink{background:var(--card-pink-bg)}.bgb-yellow{background:var(--card-yellow-bg)}.bgb-green{background:var(--card-green-bg)}.bgb-peach{background:var(--card-peach-bg)}
.pfoot{margin-top:48px;text-align:right;color:var(--ink-muted);font-size:11.5px}
@media (max-width:760px){.doc{padding:24px 18px 36px}.grid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--hairline)}.mast .r{text-align:left}}
@media (max-width:420px){.grid{grid-template-columns:1fr}}

/* Stitch brand: dark masthead band, peach wordmark */
.mast{background:var(--mast-bg);color:#F0F0F0;margin:-40px -48px 28px;padding:28px 48px;border-radius:inherit;border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:0;align-items:flex-end}
.mast .logo{color:#ECC0AC;font-size:32px;letter-spacing:-.03em;line-height:1}
.mast .r b{color:#F0F0F0}.mast .r span{color:#C0C0C0}
@media(max-width:760px){.mast{margin:-24px -18px 22px;padding:22px 18px}}
</style>

/* helpers */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const money=(v,d=2)=>'$'+Number(v).toLocaleString('en-NZ',{minimumFractionDigits:d,maximumFractionDigits:d});
const int=v=>Math.round(v).toLocaleString('en-NZ');
const dec1=v=>Number(v).toLocaleString('en-NZ',{minimumFractionDigits:1,maximumFractionDigits:1});
const pct=(v,d=2)=>v.toFixed(d)+'%';
const ratio=(a,b)=>b>0?a/b:null;
const pctDelta=(c,p)=>(p===null||p===undefined||p===0)?null:(c-p)/p*100;
const sgn=d=>(d>0?'+':d<0?'−':'')+Math.abs(d).toFixed(1)+'%';
function deltaPlain(c,p){const d=pctDelta(c,p);return d===null?'<span class="muted">New</span>':`<span class="muted">${sgn(d)} vs ${REPORT.priorShort}</span>`}
function deltaPill(c,p,invert){
  const d=pctDelta(c,p); if(d===null) return '<span class="muted">–</span>';
  const eff=invert?-d:d; const cls=Math.abs(d)<5?'warn':(eff>0?'good':'critical');
  return `<span class="pill ${cls}">${sgn(d)}</span>`;
}
const dash='<span class="muted">–</span>';
function tile(label,val,cap,delta){return `<div class="kpi"><div class="l">${label}</div><div class="v">${val}</div><div class="c">${cap||''}</div><div class="d">${delta||''}</div></div>`}

const mCPL=META.cur.spend/META.cur.leads, mCPLp=META.pri.spend/META.pri.leads;
const mCTR=META.cur.clicks/META.cur.impr*100, mCTRp=META.pri.clicks/META.pri.impr*100;
const gCPL=GADS.cur.spend/GADS.cur.lfs, gCPLp=GADS.pri.spend/GADS.pri.lfs;
const gCTR=GADS.cur.clicks/GADS.cur.impr*100, gCTRp=GADS.pri.clicks/GADS.pri.impr*100;
const totSpend=META.cur.spend+GADS.cur.spend, totSpendP=META.pri.spend+GADS.pri.spend;
const totLeads=META.cur.leads+GADS.cur.lfs, totLeadsP=META.pri.leads+GADS.pri.lfs;

function summary(){
  const best=META.ads.filter(a=>a.kind==='lead'&&a.leads>0).sort((a,b)=>b.leads-a.leads||a.spend/a.leads-b.spend/b.leads)[0];
  return `<div class="sum"><h3>September at a glance</h3><ul>
  <li>Total spend across Meta and Google was ${money(totSpend)} (${sgn(pctDelta(totSpend,totSpendP))} vs ${REPORT.priorShort}), delivering ${dec1(totLeads)} leads (${sgn(pctDelta(totLeads,totLeadsP))}).</li>
  <li>Meta: ${META.cur.leads} leads at ${money(mCPL)} each (${REPORT.priorShort}: ${META.pri.leads} at ${money(mCPLp)}). Spend fell ${Math.abs(pctDelta(META.cur.spend,META.pri.spend)).toFixed(1)}% and cost per lead held steady.</li>
  <li>Meta click-through rate rose to ${pct(mCTR)} from ${pct(mCTRp)}, helped by the new September boosted post that drove ${int(701)} landing page views at ${money(139.98/701)} each.</li>
  <li>Google Ads: ${dec1(GADS.cur.lfs)} lead form submits at ${money(gCPL)} each (${REPORT.priorShort}: ${dec1(GADS.pri.lfs)} at ${money(gCPLp)}) on almost identical spend. Performance Max stays paused.</li>
  <li>Top Meta creative by leads: ${esc(best.n)} (${best.leads} leads at ${money(best.spend/best.leads)} each).</li>
  </ul></div>`;
}

function metaSection(){
  const M=META;
  let h=`<div class="section"><div class="head"><span class="badge meta">Meta Ads</span><h2>Facebook &amp; Instagram</h2></div><div class="kpis">`;
  h+=tile('Spend',money(M.cur.spend),REPORT.currency,deltaPlain(M.cur.spend,M.pri.spend));
  h+=tile('Impressions',int(M.cur.impr),'Reach '+int(M.cur.reach),deltaPlain(M.cur.impr,M.pri.impr));
  h+=tile('Leads',int(M.cur.leads),'Plus '+M.cur.rsvps+' event RSVPs',deltaPill(M.cur.leads,M.pri.leads,false)+` <span class="muted">vs ${M.pri.leads}</span>`);
  h+=tile('Cost per lead',money(mCPL),'Avg CTR '+pct(mCTR),deltaPill(mCPL,mCPLp,true)+` <span class="muted">vs ${money(mCPLp)}</span>`);
  h+=`</div><h4>Campaign breakdown</h4><div class="tw"><table><thead><tr><th>Campaign</th><th>Spend</th><th>Δ Spend</th><th>Impressions</th><th>Clicks</th><th>CTR (vs ${REPORT.priorShort})</th><th>Result</th><th>Δ Result</th><th>Cost / result (vs ${REPORT.priorShort})</th></tr></thead><tbody>`;
  for(const c of M.campaigns){
    const ctr=c.c.clicks/c.c.impr*100, ctrp=c.p?c.p.clicks/c.p.impr*100:null;
    const cpr=c.obj==='Reach'?null:c.c.spend/c.c.res, cprp=(c.p&&c.obj!=='Reach')?c.p.spend/c.p.res:null;
    const resTxt=c.obj==='Reach'?int(c.c.res)+' reach':int(c.c.res)+' '+c.obj.toLowerCase();
    h+=`<tr><td>${esc(c.n)}${c.p?'':' <span class="muted">(launched in September)</span>'}</td><td>${money(c.c.spend)}</td><td>${c.p?deltaPlain(c.c.spend,c.p.spend).replace(' vs '+REPORT.priorShort,''):'<span class="muted">New</span>'}</td><td>${int(c.c.impr)}</td><td>${int(c.c.clicks)}</td><td>${pct(ctr)} ${ctrp===null?'':deltaPill(ctr,ctrp,false)}</td><td class="b">${resTxt}</td><td>${c.p?deltaPill(c.c.res,c.p.res,false):'<span class="muted">New</span>'}</td><td>${cpr===null?dash:money(cpr)+' '+(cprp===null?'':deltaPill(cpr,cprp,true))}</td></tr>`;
  }
  h+=`</tbody></table></div><p class="note">Results follow each campaign's own objective: leads, event RSVPs, reach or landing page views. The headline lead count covers the two lead campaigns only. Cost per lead uses total Meta spend.</p>`;
  h+=`<h4>Ad creative</h4><div class="grid">`;
  M.ads.forEach((a,i)=>{
    const top=a.kind==='lead'&&i<3;
    let rl,rv,cl,cv;
    if(a.kind==='lead'){rl='Leads';rv=int(a.leads);cl='Cost / lead';cv=a.leads>0?money(a.spend/a.leads):'–'}
    else{rl=a.resLabel;rv=int(a.res);cl=a.kind==='reach'?'Cost / 1k reach':'Cost / result';cv=a.kind==='reach'?money(a.spend/a.res*1000):money(a.spend/a.res)}
    const bg=ART[i%ART.length];
    h+=`<div class="card${top?' top':''}"><div class="art bgb-${bg}"><img src="${IMG[a.cr]}" alt="${esc(a.n)}">${top?`<span class="rank">#${i+1}</span>`:''}</div><div class="fmt ${a.f==='Video'?'video':'static'}">${a.f}</div><div class="cb"><div class="n">${esc(a.n)}</div><div class="m"><div><span>Spend</span><b>${money(a.spend)}</b></div><div><span>${rl}</span><b>${rv}</b></div><div><span>${cl}</span><b>${cv}</b></div><div><span>CTR</span><b>${pct(a.clicks/a.impr*100)}</b></div></div><div class="foot">${int(a.impr)} impressions · ${int(a.clicks)} clicks</div></div></div>`;
  });
  h+=`</div><p class="note">Ads with at least $10 spend in September, ranked by leads then cost per lead, followed by the event, boosted post and awareness ads. Ranks #1 to #3 are for the two lead campaigns. Ads showing zero leads had spend but no tracked lead in the month.</p></div>`;
  return h;
}

function googleSection(){
  const G=GADS;
  let h=`<div class="section"><div class="head"><span class="badge google">Google Ads</span><h2>Search</h2></div><div class="kpis">`;
  h+=tile('Spend',money(G.cur.spend),REPORT.currency,deltaPlain(G.cur.spend,G.pri.spend));
  h+=tile('Impressions',int(G.cur.impr),int(G.cur.clicks)+' clicks · CTR '+pct(gCTR),deltaPlain(G.cur.impr,G.pri.impr));
  h+=tile('Lead form submits',dec1(G.cur.lfs),'',deltaPill(G.cur.lfs,G.pri.lfs,false)+` <span class="muted">vs ${dec1(G.pri.lfs)}</span>`);
  h+=tile('Cost per lead form submit',money(gCPL),'',deltaPill(gCPL,gCPLp,true)+` <span class="muted">vs ${money(gCPLp)}</span>`);
  h+=`</div><h4>Campaign breakdown</h4><div class="tw"><table><thead><tr><th>Campaign</th><th>Spend</th><th>Δ Spend</th><th>Impressions</th><th>Clicks</th><th>CTR (vs ${REPORT.priorShort})</th><th>Lead form submits</th><th>Δ Submits</th><th>Cost / submit (vs ${REPORT.priorShort})</th></tr></thead><tbody>`;
  for(const c of G.campaigns){
    if(c.none){h+=`<tr><td>${esc(c.n)} <span class="muted">(paused, no delivery in period)</span></td><td>${money(0)}</td><td>${dash}</td><td>0</td><td>0</td><td>${dash}</td><td class="b">0.0</td><td>${dash}</td><td>${dash}</td></tr>`;continue}
    const ctr=c.c.clicks/c.c.impr*100, ctrp=c.p.clicks/c.p.impr*100, cp=c.c.spend/c.c.lfs, cpp=c.p.spend/c.p.lfs;
    h+=`<tr><td>${esc(c.n)}</td><td>${money(c.c.spend)}</td><td>${deltaPlain(c.c.spend,c.p.spend).replace(' vs '+REPORT.priorShort,'')}</td><td>${int(c.c.impr)}</td><td>${int(c.c.clicks)}</td><td>${pct(ctr)} ${deltaPill(ctr,ctrp,false)}</td><td class="b">${dec1(c.c.lfs)}</td><td>${deltaPill(c.c.lfs,c.p.lfs,false)}</td><td>${money(cp)} ${deltaPill(cp,cpp,true)}</td></tr>`;
  }
  h+=`<tr class="tot"><td>Total</td><td>${money(G.cur.spend)}</td><td></td><td>${int(G.cur.impr)}</td><td>${int(G.cur.clicks)}</td><td>${pct(gCTR)}</td><td>${dec1(G.cur.lfs)}</td><td></td><td>${money(gCPL)}</td></tr></tbody></table></div>`;
  h+=`<h4>Lead form submits by type</h4><div class="tw"><table><thead><tr><th>Form</th><th>September</th><th>August</th><th>Change</th></tr></thead><tbody>`;
  for(const t of G.types) h+=`<tr><td>${t.n}</td><td class="b">${dec1(t.c)}</td><td>${dec1(t.p)}</td><td>${deltaPill(t.c,t.p,false)}</td></tr>`;
  h+=`</tbody></table></div><p class="note">Lead form submits only. Call and email click actions are not counted as conversions. Fractional values come from Google's data-driven attribution.</p></div>`;
  return h;
}

function compareBlock(){
  const rows=[['Meta Ads',META.cur.spend,META.pri.spend,META.cur.leads,META.pri.leads],['Google Ads',GADS.cur.spend,GADS.pri.spend,GADS.cur.lfs,GADS.pri.lfs]];
  let h=`<h4>Spend and leads by channel</h4><div class="tw"><table><thead><tr><th>Channel</th><th>Spend</th><th>Δ Spend</th><th>Leads</th><th>Δ Leads</th><th>Cost per lead (vs ${REPORT.priorShort})</th></tr></thead><tbody>`;
  for(const r of rows){const c=r[1]/r[3],p=r[2]/r[4];h+=`<tr><td>${r[0]}</td><td>${money(r[1])}</td><td>${deltaPlain(r[1],r[2]).replace(' vs '+REPORT.priorShort,'')}</td><td class="b">${dec1(r[3])}</td><td>${deltaPill(r[3],r[4],false)}</td><td>${money(c)} ${deltaPill(c,p,true)}</td></tr>`}
  const c=totSpend/totLeads,p=totSpendP/totLeadsP;
  h+=`<tr class="tot"><td>Combined</td><td>${money(totSpend)}</td><td></td><td>${dec1(totLeads)}</td><td></td><td>${money(c)}</td></tr></tbody></table></div><p class="note">Meta leads are website and on-platform leads from the two lead campaigns. Google leads are lead form submits. Spend is the full channel spend.</p>`;
  return h;
}

document.getElementById('doc').innerHTML=
 `<div class="mast"><div class="logo">stitch</div><div class="r"><b>${REPORT.client}</b><span>Monthly performance report · ${REPORT.period}</span><span>Compared with ${REPORT.prior} · ${REPORT.currency}</span></div></div>`+
 summary()+`<div class="section" style="margin-top:28px">${compareBlock().replace('<h4>','<h4 style="margin-top:0">')}</div>`+metaSection()+googleSection()+
 `<div class="pfoot">Private &amp; Confidential<br>www.stitchtech.co</div>`;
</script>


</body></html>
