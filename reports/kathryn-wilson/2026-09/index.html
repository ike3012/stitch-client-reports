<style>
/* Layout: single 900px document panel on a light page, masthead, summary, one section per channel */
:root{
--peach:#ECC0AC;--brand-orange:#E9754B;--ink:#2D2D2D;--ink-secondary:#5a5a5a;--ink-muted:#7c7c7c;
--hairline:#e2e2e2;--surface:#ffffff;--page:#F0F0F0;--cell-bg:#F6F6F6;
--meta-badge-bg:#B3E1E8;--meta-badge-text:#1f4d57;--google-badge-bg:#D7CCF2;--google-badge-text:#3f3370;
--good-bg:#D7F9E6;--good-text:#1F5C46;--warn-bg:#FEF9C8;--warn-text:#80501D;--critical-bg:#FBE3E3;--critical-text:#8C3232;
--card-blue-bg:#DCEFF2;--card-blue-text:#1f4d57;--card-purple-bg:#ECE6F9;--card-purple-text:#3f3370;--card-pink-bg:#ECE6F9;--card-pink-text:#3f3370;
--card-yellow-bg:#ECECEC;--card-yellow-text:#5a5a5a;--card-green-bg:#DCEFF2;--card-green-text:#1f4d57;--card-peach-bg:#ECECEC;--card-peach-text:#5a5a5a;
--bar:#2D2D2D;--bar-track:#F0F0F0;
--font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--mast-bg:#2D2D2D;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--peach:#ECC0AC;--ink:#F0F0F0;--ink-secondary:#c4c4c4;--ink-muted:#9a9a9a;--hairline:#444444;--surface:#2D2D2D;--page:#1e1e1e;--cell-bg:#363636;
--meta-badge-bg:#1f4d57;--meta-badge-text:#B3E1E8;--google-badge-bg:#3f3370;--google-badge-text:#D7CCF2;
--good-bg:#1d4a38;--good-text:#a6edc9;--warn-bg:#4a4418;--warn-text:#f1df8a;--critical-bg:#5a2626;--critical-text:#f5b5b5;
--card-blue-bg:#2F4447;--card-blue-text:#B3E1E8;--card-purple-bg:#3B3550;--card-purple-text:#D7CCF2;--card-pink-bg:#3B3550;--card-pink-text:#D7CCF2;
--card-yellow-bg:#3A3A3A;--card-yellow-text:#C0C0C0;--card-green-bg:#2F4447;--card-green-text:#B3E1E8;--card-peach-bg:#3A3A3A;--card-peach-text:#C0C0C0;
--bar:#B3E1E8;--bar-track:#3a3a3a;color-scheme:dark;--mast-bg:#161616;}}
:root[data-theme="dark"]{
--peach:#ECC0AC;--ink:#F0F0F0;--ink-secondary:#c4c4c4;--ink-muted:#9a9a9a;--hairline:#444444;--surface:#2D2D2D;--page:#1e1e1e;--cell-bg:#363636;
--meta-badge-bg:#1f4d57;--meta-badge-text:#B3E1E8;--google-badge-bg:#3f3370;--google-badge-text:#D7CCF2;
--good-bg:#1d4a38;--good-text:#a6edc9;--warn-bg:#4a4418;--warn-text:#f1df8a;--critical-bg:#5a2626;--critical-text:#f5b5b5;
--card-blue-bg:#2F4447;--card-blue-text:#B3E1E8;--card-purple-bg:#3B3550;--card-purple-text:#D7CCF2;--card-pink-bg:#3B3550;--card-pink-text:#D7CCF2;
--card-yellow-bg:#3A3A3A;--card-yellow-text:#C0C0C0;--card-green-bg:#2F4447;--card-green-text:#B3E1E8;--card-peach-bg:#3A3A3A;--card-peach-text:#C0C0C0;
--bar:#B3E1E8;--bar-track:#3a3a3a;color-scheme:dark;--mast-bg:#161616;}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:24px}
.doc{max-width:900px;margin:0 auto;background:var(--surface);padding:40px 48px 56px;border-radius:4px}
.mast{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.logo{font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--peach);line-height:1}
.mast .r{text-align:right}.mast .r b{display:block;font-size:16px}.mast .r span{color:var(--ink-muted);font-size:12px}
h2{font-size:20px;margin:0;text-wrap:balance}
h3{font-size:14px;margin:28px 0 10px}
.sum{background:var(--cell-bg);border-radius:12px;padding:18px 22px;margin-bottom:8px}
.sum h3{margin:0 0 8px}.sum ul{margin:0;padding-left:18px}.sum li{margin:4px 0}
section{margin-top:40px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:999px}
.badge.meta{background:var(--meta-badge-bg);color:var(--meta-badge-text)}.badge.google{background:var(--google-badge-bg);color:var(--google-badge-text)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--hairline);border-radius:12px;overflow:hidden;margin-bottom:12px}
.kpi{padding:14px 16px;border-left:1px solid var(--hairline);min-width:0}.kpi:first-child{border-left:0}
.kpis.second{margin-top:-2px}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);font-weight:600}
.kpi .v{font-size:25px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .c{font-size:11px;color:var(--ink-muted);min-height:16px}
.kpi .d{font-size:11px;margin-top:4px;color:var(--ink-secondary)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.pill.good{background:var(--good-bg);color:var(--good-text)}.pill.warn{background:var(--warn-bg);color:var(--warn-text)}.pill.critical{background:var(--critical-bg);color:var(--critical-text)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--hairline) transparent}
.tw::-webkit-scrollbar{height:6px}.tw::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{text-align:right;vertical-align:bottom;font-size:10px;text-transform:uppercase;letter-spacing:.04em;line-height:1.3;color:var(--ink-muted);padding:8px 7px;border-bottom:1px solid var(--hairline);white-space:normal}
td{padding:10px 7px;border-bottom:1px solid var(--hairline);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:130px;padding-left:0}
th:last-child,td:last-child{padding-right:2px}
@media(max-width:760px){
.tw{margin-right:-18px;padding-right:18px;background:linear-gradient(to left,var(--surface),transparent 24px) right/24px 100% no-repeat local}
th:first-child,td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);min-width:118px;box-shadow:1px 0 0 var(--hairline)}
.tw-hint{display:block}
}
.tw-hint{display:none;font-size:11px;color:var(--ink-muted);margin:6px 0 0}
td.b{font-weight:700}
.note{font-size:12px;color:var(--ink-secondary);margin:10px 0 0}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart{border:1px solid var(--hairline);border-radius:12px;padding:12px 14px;min-width:0}
.chart .t{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);font-weight:600}
.chart svg{width:100%;height:auto;display:block;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{border:1px solid var(--hairline);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0;position:relative}
.card.top{border:1.5px solid var(--brand-orange)}
.art{aspect-ratio:1/1;display:flex;align-items:flex-end;position:relative}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rank{position:absolute;top:8px;right:8px;background:var(--brand-orange);color:#2D2D2D;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;z-index:2}
.fmt{position:relative;z-index:2;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;margin:8px;border-radius:6px;background:var(--surface)}
.fmt.static{color:var(--card-blue-text)}.fmt.video{color:var(--card-purple-text)}.fmt.carousel,.fmt.catalogue{color:var(--card-purple-text)}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:16px 14px 40px;background:var(--card-purple-bg);color:var(--card-purple-text);text-align:center}.ph b{font-size:13px}.ph span{font-size:11px;line-height:1.35}
.cb{padding:10px 12px 12px}.cb .n{font-weight:700;font-size:12.5px;line-height:1.3;min-height:32px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.mini div{background:var(--cell-bg);border-radius:8px;padding:5px 8px}
.mini span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted)}
.mini b{font-size:13px;font-variant-numeric:tabular-nums}
.mini div{min-width:0}
@media(max-width:760px){.mini{gap:4px}.mini div{padding:5px 6px}.mini span{font-size:8.5px;letter-spacing:.02em}.mini b{font-size:12px}}
.foot{font-size:11px;color:var(--ink-muted)}
footer{margin-top:48px;text-align:right;color:var(--ink-muted);font-size:11px}
@media(max-width:760px){.doc{padding:24px 18px 36px}.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--hairline)}.grid{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr}.mast .r{text-align:left}}

/* Stitch brand: dark masthead band, peach wordmark */
.mast{background:var(--mast-bg);color:#F0F0F0;margin:-40px -48px 28px;padding:28px 48px;border-radius:inherit;border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:0;align-items:flex-end}
.mast .logo{color:#ECC0AC;font-size:32px;letter-spacing:-.03em;line-height:1}
.mast .r b{color:#F0F0F0}.mast .r span{color:#C0C0C0}
@media(max-width:760px){.mast{margin:-24px -18px 22px;padding:22px 18px}}
</style>
